<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fresh Valley</title>
  <meta name="description" content="Export-grade produce from Fresh Valley — graded by hand, delivered next-day across Cairo.">
  <meta name="theme-color" content="#19291C">
  <meta property="og:type" content="product">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/fraunces-v4s.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/jakarta-s.woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/shop.css">
  <script>!function(d,w){var h=d.documentElement;if(!/[?&]fv_preview=1/.test(location.search)&&!w.matchMedia("(prefers-reduced-motion: reduce)").matches){h.classList.add("m-on");setTimeout(function(){if(!(w.FVMotion&&w.FVMotion.ready))h.classList.remove("m-on")},3500)}}(document,window)</script>
</head>
<body data-page="product">
  <div id="fv-header"></div>
  <noscript><p class="noscript">Fresh Valley uses JavaScript for its menu, basket and checkout. <a href="products.html">Browse the collection</a> · <a href="contact.html">Contact us</a></p></noscript>
  <main id="main"></main>
  <div id="fv-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/sections.js"></script>
  <script>
    (function () {
      const root = document.getElementById("main");
      const S = window.FVSections, esc = FV.esc, I = FV.icon;
      const params = new URLSearchParams(location.search);
      const slug = params.get("slug"), boxSlug = params.get("box");
      const $ = (id) => document.getElementById(id);
      const catName = { fruits: "Fruits", vegetables: "Vegetables", herbs: "Herbs" };

      function meta(title, desc) {
        document.title = title + " — Fresh Valley";
        const m = document.querySelector('meta[name="description"]'); if (m && desc) m.content = desc;
      }
      function ld(obj) { const s = document.createElement("script"); s.type = "application/ld+json"; s.textContent = JSON.stringify(obj); document.head.appendChild(s); }
      function notFound() {
        meta("Not found");
        root.innerHTML = `<section class="s shop-head"><div class="wrap wrap--narrow" style="text-align:center"><div class="shop-empty">
          <div class="empty__art">${S.ART.leaf}</div><h1 class="h2">This one has <em class="i">sold through</em>.</h1>
          <p class="muted" style="margin-top:.6rem">We couldn't find that product — the rest of the market is fresh and waiting.</p>
          <a class="btn" href="products.html" style="margin-top:1.4rem">View the collection<span class="btn__ic">${I("arrow")}</span></a></div></div></section>`;
      }
      function qtyHTML() {
        return `<div class="qty"><button type="button" id="qDec" aria-label="Decrease quantity">${I("minus")}</button><input id="qVal" type="text" inputmode="numeric" value="1" aria-label="Quantity"><button type="button" id="qInc" aria-label="Increase quantity">${I("plus")}</button></div>`;
      }
      function bindQty(onChange) {
        let qty = 1;
        const input = $("qVal");
        const set = (v) => { qty = Math.max(1, Math.min(99, v)); input.value = qty; onChange(qty); };
        $("qDec").addEventListener("click", () => set(qty - 1));
        $("qInc").addEventListener("click", () => set(qty + 1));
        input.addEventListener("input", () => { const v = input.value.replace(/[^0-9]/g, ""); input.value = v; qty = Math.max(1, parseInt(v || "1", 10)); onChange(qty); });
        input.addEventListener("blur", () => { if (!input.value || +input.value < 1) set(1); });
      }
      function stickyBar(anchorSel) {
        const bar = $("stickyBuy"), anchor = root.querySelector(anchorSel);
        if (!bar || !anchor) return;
        const on = () => {
          const show = anchor.getBoundingClientRect().bottom < 0;
          bar.classList.toggle("show", show);
          bar.setAttribute("aria-hidden", String(!show));
          bar.toggleAttribute("inert", !show);
        };
        addEventListener("scroll", on, { passive: true }); on();
      }
      function cutoff() {
        const el = $("cutoffTime"); if (!el) return;
        const tick = () => { el.textContent = FV.cutoffText(); };
        tick(); setInterval(tick, 30000);
      }
      function trustList() {
        return `<ul class="trust">
          <li>${I("truck")}<span>Complimentary delivery over ${FV.money(FV.settings.freeThreshold)} · next-day slots</span></li>
          <li>${I("shield")}<span>Export-grade. If it isn't perfect, we replace it.</span></li>
          <li>${I("snow")}<span>Cold-chain kept from grading table to your door.</span></li></ul>`;
      }
      function reviewsFor(names, tags) {
        let rs = FV.data.reviews.filter((r) => names.some((n) => r.tag === n) || tags.includes(r.tag));
        if (rs.length < 3) rs = rs.concat(FV.data.reviews.filter((r) => !rs.includes(r))).slice(0, 3);
        return rs.slice(0, 6);
      }
      function afterAdd(btn) {
        if (window.FVMotion) window.FVMotion.fly(btn);
        btn.classList.add("is-added");
        const lbl = btn.querySelector(".lbl"), old = lbl && lbl.textContent;
        if (lbl) lbl.textContent = "Added to basket";
        setTimeout(() => { btn.classList.remove("is-added"); if (lbl) lbl.textContent = old; }, 1600);
      }

      if (boxSlug) { const b = FV.findBox(boxSlug); b ? renderBox(b) : notFound(); }
      else { const p = FV.find(slug); p ? renderProduct(p) : notFound(); }

      /* ============================ PRODUCT ============================ */
      function renderProduct(p) {
        meta(p.name, p.short + " " + (p.desc || ""));
        const isKg = p.unit === "kg", cat = catName[p.category] || "Produce";
        const sold = FV.soldOut(p);
        const seasonal = (p.badges || []).includes("seasonal") || (p.collections || []).includes("seasonal");
        const scarce = !sold && (seasonal || (p.collections || []).includes("organic-reserve"));
        const pct = FV.scarcityPct(p.slug);
        const custom = FV.isCustomImg(p.image);
        const media = p.noPhoto
          ? `<div class="media--herb"><svg class="art herb-art" viewBox="0 0 120 150" aria-hidden="true"><path d="M60 146C58 110 62 70 58 8"/><path d="M59 126c-12-3-22-11-27-21 11 0 21 6 27 16"/><path d="M60 108c11-3 20-11 24-22-11 0-20 7-24 17"/><path d="M59 90c-12-2-22-10-28-20 11-1 21 5 27 15"/><path d="M60 72c11-3 20-11 24-22-11 0-20 7-24 17"/><path d="M58 54c-11-2-20-9-25-18 10-1 19 4 25 13"/><path d="M59 38c9-3 17-10 20-19-9 1-16 6-20 14"/></svg><span>${esc(p.name)}</span></div>`
          : custom ? `<img src="${esc(p.image)}" alt="${esc(p.name)}" width="1000" height="1000" fetchpriority="high">`
          : `<picture><source type="image/webp" srcset="${FV.webp(FV.thumb(p.slug))} 540w, ${FV.webp(FV.img(p.slug))} 1000w" sizes="(max-width: 1100px) 92vw, 50vw"><img src="${FV.img(p.slug)}" srcset="${FV.thumb(p.slug)} 540w, ${FV.img(p.slug)} 1000w" sizes="(max-width: 1100px) 92vw, 50vw" alt="${esc(p.name)}" width="1000" height="1000" fetchpriority="high" decoding="async"></picture>`;
        const flags = [
          `<span class="chip chip--glass">${I("shield")}${esc(FV.topLabel(p))}</span>`,
          seasonal ? `<span class="chip chip--olive">${I("sparkle")} In season</span>` : "",
          sold ? `<span class="chip chip--forest">Sold out</span>` : "",
          p.compareAt && +p.compareAt > FV.cardPrice(p).value ? `<span class="chip chip--pom">Save ${Math.round((1 - FV.cardPrice(p).value / +p.compareAt) * 100)}%</span>` : "",
        ].join("");
        const n = p.nutrition || {};
        const pair = (p.pairings || []).filter((s) => s !== p.slug).map(FV.find).filter(Boolean).slice(0, 4);
        const related = FV.byCategory(p.category).filter((x) => x.slug !== p.slug && !pair.includes(x)).slice(0, 10);
        const recents = FV.recent.list().filter((s) => s !== p.slug).map(FV.find).filter(Boolean).slice(0, 10);
        const revs = reviewsFor([p.name], []);

        root.innerHTML = `
        <section class="s pdp" aria-labelledby="pName">
          <div class="wrap wrap--wide">
            <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><a href="products.html?cat=${p.category}">${cat}</a><span aria-hidden="true">/</span><span aria-current="page">${esc(p.name)}</span></nav>
            <div class="pdp__grid">
              <div class="pdp__media">
                <div class="pdp__frame" data-clip>${media}<div class="pdp__flags">${flags}</div></div>
                <div class="pdp__facts">
                  <div class="fact">${I("pin")}<small>Origin</small><strong>${esc(p.origin)}</strong></div>
                  <div class="fact">${I("calendar")}<small>Season</small><strong>${esc(p.season)}</strong></div>
                  <div class="fact">${I("snow")}<small>Handling</small><strong>Hand-graded, cold-chain</strong></div>
                </div>
              </div>
              <div class="pdp__info">
                <div class="row"><span class="chip chip--soft">${esc(FV.topLabel(p))} · ${cat}</span></div>
                <h1 id="pName" data-split>${esc(p.name)}</h1>
                <div class="pdp__rating"><span class="stars" aria-hidden="true">${I("star").repeat(Math.round(p.rating || 5))}</span><strong>${(p.rating || 5).toFixed(1)}</strong><a href="#reviews">${p.reviews || 0} reviews</a></div>
                <p class="lede">${esc(p.desc || p.short)}</p>
                <div class="pdp__price" aria-live="polite"><b id="price"></b><small id="per"></small>${p.compareAt && +p.compareAt > FV.cardPrice(p).value ? `<s>${FV.money(+p.compareAt)}</s>` : ""}</div>
                <p class="pdp__sub">${isKg ? "Price updates as you choose your weight — gentle savings on bigger baskets." : p.unit === "bunch" ? "Sold by the bunch, cut to order." : "Sold as a single piece, hand-selected."}</p>
                ${scarce ? `<div class="avail" id="avail"><div class="avail__top"><span class="avail__label">Selling fast this week</span><span class="avail__pct" id="availPct">${pct}%</span></div><div class="avail__bar"><i id="availFill"></i></div><p class="avail__note">${pct}% of this week's allocation claimed. ${seasonal ? "In season now — a short window while it's at its best." : "A small, limited allocation each week."}</p></div>` : ""}
                ${isKg ? `<div class="pick"><div class="pick__lab"><span>Select weight</span><b id="selLabel">1 kg</b></div>
                  <div class="seg" id="weights" role="group" aria-label="Weight">${FV.weightOptions.map((w) => `<button type="button" data-g="${w.g}" aria-pressed="${!!w.default}">${w.label}</button>`).join("")}</div>
                  <p class="pick__save" id="saveNote" aria-live="polite"></p></div>` : ""}
                <div class="pdp__buy" id="buyRow">
                  ${qtyHTML()}
                  <button class="btn btn--lg" type="button" id="addBtn"${sold ? " disabled" : ""}><span class="lbl">${sold ? "Sold out" : "Add to basket"}</span> · <span id="btnTotal"></span><span class="btn__ic">${I("bag")}</span></button>
                  <button class="pdp__wish" type="button" data-wish="${p.slug}" aria-label="Save ${esc(p.name)} to wishlist" aria-pressed="false">${I("heart")}</button>
                </div>
                <div class="cutoff">${I("clock")}<span>Order within <b id="cutoffTime"></b> for next-day delivery.</span></div>
                ${trustList()}
                <div class="acc">
                  <details open><summary>The detail<span class="pm" aria-hidden="true"></span></summary><div class="acc__panel"><p>${esc(p.desc || "")} ${esc(p.short || "")}</p></div></details>
                  <details><summary>Storage &amp; care<span class="pm" aria-hidden="true"></span></summary><div class="acc__panel"><p>${esc(p.storage || "Keep cool and dry.")}</p></div></details>
                  <details><summary>Origin &amp; season<span class="pm" aria-hidden="true"></span></summary><div class="acc__panel"><p>Grown in ${esc(p.origin)}. At its best ${String(p.season).toLowerCase() === "all year" ? "all year round" : "during " + esc(p.season)}. Selected only from lots that meet export specification.</p></div></details>
                  ${n.energy ? `<details><summary>Nutrition<span class="pm" aria-hidden="true"></span></summary><div class="acc__panel"><table class="nutri"><caption>Typical values · ${esc(n.serving)}</caption><tbody><tr><td>Energy</td><td>${esc(n.energy)}</td></tr><tr><td>Carbohydrate</td><td>${esc(n.carbs)}</td></tr><tr><td>of which sugars</td><td>${esc(n.sugars)}</td></tr><tr><td>Fibre</td><td>${esc(n.fibre)}</td></tr><tr><td>Vitamin C</td><td>${esc(n.vitc)}</td></tr></tbody></table></div></details>` : ""}
                </div>
              </div>
            </div>
          </div>
        </section>

        ${pair.length ? `<section class="s sec band--kraft">
          <div class="wrap wrap--wide">
            <div class="head pair-head"><div class="head__main"><p class="eyebrow">For the table</p><h2 data-split>Pairs beautifully <em class="i">with</em></h2></div>
              ${pair.length >= 2 ? `<div class="head__actions"><button class="btn btn--olive" type="button" id="addPair">Add the pairing · ${FV.money(pair.reduce((s, x) => s + FV.defaultVariant(x).price, 0))}<span class="btn__ic">${I("plus")}</span></button></div>` : ""}</div>
            <div class="grid-products">${pair.map(FV.productCardHTML).join("")}</div>
          </div></section>` : ""}

        <section class="s sec--sm">
          <div class="wrap wrap--wide">
            <div class="host-rec" data-reveal>
              <div class="host-rec__img">${S.img("pepper-medley", { sizes: "220px", alt: "The Hosting Box" })}</div>
              <div><p class="eyebrow">Hosting recommendation</p><h3>Make it a table, <em class="i">not a plate</em>.</h3><p>Add The Hosting Box and let us arrange the rest — fruit, dates and a finishing herb, ready for guests.</p></div>
              <a class="btn btn--olive" href="product.html?box=hosting-box">Explore the box<span class="btn__ic">${I("arrow")}</span></a>
            </div>
          </div>
        </section>

        <section class="s sec band--paper" id="reviews">
          <div class="wrap wrap--wide">
            <div class="head"><div class="head__main"><p class="eyebrow">From our hosts</p><h2 data-split>Loved at <em class="i">real tables</em></h2></div>
              <div class="head__actions"><span class="rating-pill"><b>${(p.rating || 5).toFixed(1)}</b><span class="stars">${I("star").repeat(5)}</span><span>${p.reviews || 0} reviews</span></span></div></div>
            <div class="rev-grid" data-stagger>${revs.slice(0, 3).map(FV.reviewCardHTML).join("")}</div>
          </div>
        </section>

        ${related.length ? `<section class="s sec band--sage">
          <div class="wrap wrap--wide">
            <div class="head"><div class="head__main"><p class="eyebrow">More ${cat.toLowerCase()}</p><h2 data-split>You may also <em class="i">like</em></h2></div>
              <div class="head__actions"><a class="link-u" href="products.html?cat=${p.category}">View all ${I("arrow")}</a></div></div>
            <div class="rail-wrap"><div class="rail" data-cursor="Drag">${related.map(FV.productCardHTML).join("")}</div><div class="rail-progress" aria-hidden="true"><i></i></div></div>
          </div></section>` : ""}

        ${recents.length >= 2 ? `<section class="s sec band--paper">
          <div class="wrap wrap--wide">
            <div class="head"><div class="head__main"><p class="eyebrow">Pick up where you left off</p><h2 data-split>Recently <em class="i">viewed</em></h2></div></div>
            <div class="rail-wrap"><div class="rail" data-cursor="Drag">${recents.map(FV.productCardHTML).join("")}</div><div class="rail-progress" aria-hidden="true"><i></i></div></div>
          </div></section>` : ""}

        <div class="sticky-buy" id="stickyBuy" aria-hidden="true" inert>
          <div class="sticky-buy__info"><strong>${esc(p.name)}</strong><span id="stickyPrice"></span></div>
          <button class="btn btn--olive btn--sm" type="button" id="stickyAdd"${sold ? " disabled" : ""}>${sold ? "Sold out" : "Add to basket"}<span class="btn__ic">${I("bag")}</span></button>
        </div>`;

        FV.recent.push(p.slug);
        let grams = 1000, qty = 1;
        const unitPrice = () => isKg ? FV.priceForWeight(p, grams) : p.pricePerUnit;
        const variant = () => isKg ? FV.weightLabel(grams) : (p.unit === "bunch" ? "per bunch" : "each");
        function refresh() {
          const up = unitPrice();
          $("price").textContent = FV.money(up);
          $("per").textContent = isKg ? "/ " + variant() : (p.unit === "bunch" ? "/ bunch" : "each");
          $("btnTotal").textContent = FV.money(up * qty);
          $("stickyPrice").textContent = qty + " × " + variant() + " · " + FV.money(up * qty);
          if (isKg) {
            $("selLabel").textContent = variant();
            const full = Math.round(p.pricePerKg * grams / 1000), save = full - up;
            $("saveNote").textContent = save > 0 ? "You save " + FV.money(save) + " on this size" : "";
          }
        }
        if (isKg) root.querySelectorAll("#weights [data-g]").forEach((b) => b.addEventListener("click", () => {
          grams = +b.dataset.g;
          root.querySelectorAll("#weights [data-g]").forEach((x) => x.setAttribute("aria-pressed", x === b));
          refresh();
        }));
        bindQty((q) => { qty = q; refresh(); });
        function add(btn) {
          if (sold) return;
          FV.cart.add({ key: p.slug + "|" + variant(), slug: p.slug, type: "product", name: p.name, image: custom ? p.image : p.slug, noPhoto: !!p.noPhoto, variant: variant(), price: unitPrice(), qty });
          FV.toast(p.name + " added", qty + " × " + variant(), true);
          afterAdd(btn);
        }
        $("addBtn").addEventListener("click", (e) => add(e.currentTarget));
        $("stickyAdd").addEventListener("click", (e) => add(e.currentTarget));
        const ap = $("addPair");
        if (ap) ap.addEventListener("click", () => {
          pair.forEach((x) => { const dv = FV.defaultVariant(x); FV.cart.add({ key: x.slug + "|" + dv.variant, slug: x.slug, type: "product", name: x.name, image: FV.isCustomImg(x.image) ? x.image : x.slug, noPhoto: !!x.noPhoto, variant: dv.variant, price: dv.price }); });
          FV.toast(pair.length + " items added", "The pairing", true);
          if (window.FVMotion) window.FVMotion.fly(ap);
        });
        const fill = $("availFill");
        if (fill) {
          const run = () => { fill.style.width = pct + "%"; };
          if ("IntersectionObserver" in window) { const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { run(); io.disconnect(); } }), { threshold: 0.4 }); io.observe($("avail")); } else run();
        }
        refresh(); cutoff(); stickyBar("#buyRow"); FV.updateWishUI();
        S.behave(root);
        ld({ "@context": "https://schema.org", "@type": "Product", name: p.name, description: p.desc, image: p.noPhoto ? [] : [new URL(custom ? p.image : FV.img(p.slug), location.href).href], brand: { "@type": "Brand", name: "Fresh Valley" }, category: cat,
          offers: { "@type": "Offer", priceCurrency: FV.settings.currency, price: isKg ? FV.priceForWeight(p, 1000) : p.pricePerUnit, availability: sold ? "https://schema.org/OutOfStock" : "https://schema.org/InStock", url: location.href },
          aggregateRating: { "@type": "AggregateRating", ratingValue: p.rating, reviewCount: p.reviews } });
      }

      /* ============================== BOX ============================== */
      function renderBox(b) {
        meta(b.name, b.tagline + " " + b.desc);
        const RIBBONS = [["Mid Forest", "#2D4630"], ["Charcoal", "#2A2622"]];
        const others = FV.data.boxes.filter((x) => x.slug !== b.slug);
        const revs = reviewsFor([b.name], ["Hosting Box", "The Art of Hosting"]);
        const sold = FV.soldOut(b);
        root.innerHTML = `
        <section class="s pdp" aria-labelledby="pName">
          <div class="wrap wrap--wide">
            <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><a href="products.html?cat=boxes">Boxes</a><span aria-hidden="true">/</span><span aria-current="page">${esc(b.name)}</span></nav>
            <div class="pdp__grid">
              <div class="pdp__media">
                <div class="pdp__frame" data-clip>${FV.picture(b.image, "(max-width: 1100px) 92vw, 50vw", b.name, { eager: true })}
                  <div class="pdp__flags"><span class="chip chip--olive">${I("gift")} Curated box</span>${b.slug === "hosting-box" ? `<span class="chip chip--glass">${I("star")} Most gifted</span>` : ""}</div>
                  <div class="sticker pdp__stamp" aria-hidden="true"><svg class="ring" viewBox="0 0 120 120"><defs><path id="stkBox" d="M60 60m-47 0a47 47 0 1 1 94 0a47 47 0 1 1-94 0"/></defs><text><textPath href="#stkBox" textLength="292" lengthAdjust="spacing">Wrapped by hand • Tied in ribbon •</textPath></text></svg><span class="sticker__core">${S.ART.leaf}</span></div>
                </div>
                <div class="pdp__facts">
                  <div class="fact">${I("gift")}<small>Presentation</small><strong>Arranged &amp; wrapped</strong></div>
                  <div class="fact">${I("snow")}<small>Handling</small><strong>Cold-chain to door</strong></div>
                  <div class="fact">${I("truck")}<small>Delivery</small><strong>Next-day, ready to serve</strong></div>
                </div>
              </div>
              <div class="pdp__info">
                <div class="row"><span class="chip chip--soft">Fresh Valley boxes</span></div>
                <h1 id="pName" data-split>${esc(b.name)}</h1>
                <p class="lede">${esc(b.desc)}</p>
                <div class="pdp__price" aria-live="polite"><b id="price"></b><small id="per"></small></div>
                <div class="pick"><div class="pick__lab"><span>Select size</span><b id="selLabel"></b></div>
                  <div class="tiers" id="tiers" role="group" aria-label="Box size">${b.tiers.map((t, i) => `<button type="button" class="tier" data-tier="${i}" aria-pressed="${i === 0}"><span class="tier__dot" aria-hidden="true"></span><span><span class="tier__name">${esc(t.label)}</span><span class="tier__serves">Serves ${esc(t.serves)}</span></span><span class="tier__price">${FV.money(t.price)}</span></button>`).join("")}</div></div>
                <div class="pick"><div class="pick__lab"><span>Ribbon</span><b id="ribLabel">${RIBBONS[0][0]}</b></div>
                  <div class="ribbons" id="ribbons" role="group" aria-label="Ribbon colour">${RIBBONS.map((r, i) => `<button type="button" class="ribbon" data-rib="${r[0]}" aria-pressed="${i === 0}"><i style="background:${r[1]}"></i>${r[0]}</button>`).join("")}</div></div>
                <div class="field note-field"><label for="giftNote">A handwritten card <span class="muted">(optional)</span></label>
                  <textarea class="textarea" id="giftNote" maxlength="200" placeholder="Your words, written by hand…"></textarea>
                  <span class="hint"><span>We write it by hand and tuck it in the box.</span><span id="noteCount">0 / 200</span></span></div>
                <div class="pdp__buy" id="buyRow">
                  ${qtyHTML()}
                  <button class="btn btn--lg" type="button" id="addBtn"${sold ? " disabled" : ""}><span class="lbl">${sold ? "Sold out" : "Add box"}</span> · <span id="btnTotal"></span><span class="btn__ic">${I("gift")}</span></button>
                </div>
                <div class="cutoff">${I("clock")}<span>Order within <b id="cutoffTime"></b> for next-day delivery.</span></div>
                ${trustList()}
                <div class="acc">
                  <details open><summary>What's inside<span class="pm" aria-hidden="true"></span></summary><div class="acc__panel"><ul class="includes">${(b.includes || []).map((i) => `<li>${I("check")}<span>${esc(i)}</span></li>`).join("")}</ul><p class="muted small" style="margin-top:.8rem">Contents adapt to the season, so every box is at its peak.</p></div></details>
                  <details><summary>How it arrives<span class="pm" aria-hidden="true"></span></summary><div class="acc__panel"><p>Composed like a still life, wrapped in our own pressed-leaf paper and tied with the ribbon you choose. Delivered cold, next-day, in the slot you pick at checkout.</p></div></details>
                  <details><summary>Freshness promise<span class="pm" aria-hidden="true"></span></summary><div class="acc__panel"><p>Everything is graded to export standard. If anything isn't perfect, tell us within 24 hours and we'll replace or refund it — no debate.</p></div></details>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="s sec band--paper" id="reviews">
          <div class="wrap wrap--wide">
            <div class="head"><div class="head__main"><p class="eyebrow">From our hosts</p><h2 data-split>The gift they <em class="i">remembered</em></h2></div></div>
            <div class="rev-grid" data-stagger>${revs.slice(0, 3).map(FV.reviewCardHTML).join("")}</div>
          </div>
        </section>

        <section class="s sec band--kraft">
          <div class="wrap wrap--wide">
            <div class="head"><div class="head__main"><p class="eyebrow">More boxes</p><h2 data-split>Other ways to <em class="i">host</em></h2></div>
              <div class="head__actions"><a class="link-u" href="products.html?cat=boxes">All boxes ${I("arrow")}</a></div></div>
            <div class="deck deck--3" data-fan>${others.slice(0, 3).map(FV.boxCardHTML).join("")}</div>
          </div>
        </section>

        <div class="sticky-buy" id="stickyBuy" aria-hidden="true" inert>
          <div class="sticky-buy__info"><strong>${esc(b.name)}</strong><span id="stickyPrice"></span></div>
          <button class="btn btn--olive btn--sm" type="button" id="stickyAdd"${sold ? " disabled" : ""}>Add box<span class="btn__ic">${I("gift")}</span></button>
        </div>`;

        let tier = 0, qty = 1, ribbon = RIBBONS[0][0];
        const note = $("giftNote");
        function refresh() {
          const t = b.tiers[tier];
          $("price").textContent = FV.money(t.price);
          $("per").textContent = "serves " + t.serves;
          $("selLabel").textContent = t.label;
          $("btnTotal").textContent = FV.money(t.price * qty);
          $("stickyPrice").textContent = qty + " × " + t.label + " · " + FV.money(t.price * qty);
        }
        root.querySelectorAll("#tiers [data-tier]").forEach((el) => el.addEventListener("click", () => {
          tier = +el.dataset.tier;
          root.querySelectorAll("#tiers [data-tier]").forEach((x) => x.setAttribute("aria-pressed", x === el));
          refresh();
        }));
        root.querySelectorAll("#ribbons [data-rib]").forEach((el) => el.addEventListener("click", () => {
          ribbon = el.dataset.rib; $("ribLabel").textContent = ribbon;
          root.querySelectorAll("#ribbons [data-rib]").forEach((x) => x.setAttribute("aria-pressed", x === el));
        }));
        note.addEventListener("input", () => { $("noteCount").textContent = note.value.length + " / 200"; });
        bindQty((q) => { qty = q; refresh(); });
        function add(btn) {
          if (sold) return;
          const t = b.tiers[tier], msg = note.value.trim().replace(/[<>]/g, "");
          const noteText = ribbon + " ribbon" + (msg ? " · Card: " + msg : "");
          FV.cart.add({ key: b.slug + "|" + t.label + "|" + ribbon + "|" + msg.slice(0, 24), slug: b.slug, type: "box", name: b.name, image: b.image, variant: t.label + " · " + ribbon + " ribbon" + (msg ? " · with card" : ""), note: noteText, price: t.price, qty });
          FV.toast(b.name + " added", t.label + " · " + ribbon + " ribbon", true);
          afterAdd(btn);
        }
        $("addBtn").addEventListener("click", (e) => add(e.currentTarget));
        $("stickyAdd").addEventListener("click", (e) => add(e.currentTarget));
        refresh(); cutoff(); stickyBar("#buyRow");
        ld({ "@context": "https://schema.org", "@type": "Product", name: b.name, description: b.desc, image: [new URL(FV.img(b.image), location.href).href], brand: { "@type": "Brand", name: "Fresh Valley" },
          offers: { "@type": "AggregateOffer", priceCurrency: FV.settings.currency, lowPrice: Math.min(...b.tiers.map((t) => t.price)), highPrice: Math.max(...b.tiers.map((t) => t.price)), offerCount: b.tiers.length } });
      }
    })();
  </script>
  <script defer src="assets/vendor/gsap.min.js"></script>
  <script defer src="assets/vendor/ScrollTrigger.min.js"></script>
  <script defer src="assets/vendor/SplitText.min.js"></script>
  <script defer src="assets/vendor/lenis.min.js"></script>
  <script defer src="assets/js/motion.js"></script>
</body>
</html>
