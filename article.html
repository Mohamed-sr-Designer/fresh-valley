<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Journal — Fresh Valley</title>
  <meta name="description" content="Recipes, hosting tips and a little produce education from Fresh Valley.">
  <meta name="theme-color" content="#19291C">
  <meta property="og:type" content="article">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/fraunces-v4s.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/jakarta-s.woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>!function(d,w){var h=d.documentElement;if(!/[?&]fv_preview=1/.test(location.search)&&!w.matchMedia("(prefers-reduced-motion: reduce)").matches){h.classList.add("m-on");setTimeout(function(){if(!(w.FVMotion&&w.FVMotion.ready))h.classList.remove("m-on")},3500)}}(document,window)</script>
</head>
<body data-page="article">
  <div id="fv-header"></div>
  <noscript><p class="noscript">Fresh Valley uses JavaScript for its menu, basket and checkout. <a href="products.html">Browse the collection</a> · <a href="contact.html">Contact us</a></p></noscript>
  <div class="read-bar" aria-hidden="true"><i id="readBar"></i></div>

  <main id="main"></main>

  <div id="fv-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/sections.js"></script>
  <script>
    (function () {
      const root = document.getElementById("main");
      const S = window.FVSections, esc = FV.esc;
      const slug = new URLSearchParams(location.search).get("slug");
      const list = FV.data.articles;
      const a = list.find((x) => x.slug === slug);
      const arrow = FV.icon("arrow"), back = FV.icon("arrowL");

      if (!a) {
        root.innerHTML = `<section class="s s-page-head"><div class="wrap wrap--narrow" style="text-align:center">
          <div class="empty"><div class="empty__art">${S.ART.leaf}</div><h1 class="h2">This story has <em class="i">wandered off</em>.</h1>
          <p class="lede" style="margin:1rem auto 1.6rem">It may have moved — the rest of the Journal is right here.</p>
          <a class="btn" href="journal.html">Back to the Journal<span class="btn__ic">${arrow}</span></a></div></div></section>`;
        return;
      }
      document.title = a.title + " — Fresh Valley Journal";
      const md = document.querySelector('meta[name="description"]'); if (md) md.content = a.excerpt;

      // Shop the story: the article's hero produce + anything it mentions by name
      const words = (a.title + " " + a.body.join(" ")).toLowerCase();
      const hints = [["strawberr", "strawberry"], ["mango", "mango"], ["date", "medjool-dates"], ["grape", "red-grapes"], ["grape", "green-grapes"], ["cherr", "cherry"], ["orange", "orange"], ["lemon", "lemon"], ["pepper", "pepper-medley"], ["apple", "red-apple"], ["banana", "banana"], ["tomato", "tomato"], ["potato", "potato"], ["onion", "onion"], ["garlic", "garlic"], ["peach", "peach"], ["melon", "cantaloupe"]];
      const shop = [];
      const push = (s) => { const p = FV.find(s); if (p && !shop.includes(p)) shop.push(p); };
      push(a.image);
      hints.forEach(([w, s]) => { if (words.includes(w)) push(s); });
      const boxes = a.category === "Hosting" ? ["hosting-box", "premium-fruit-box"].map(FV.findBox).filter(Boolean) : [];

      // Body with a pull-quote lifted from the middle
      const mid = Math.max(1, Math.floor(a.body.length / 2));
      let quote = (a.body[mid - 1] || a.body[0]).split(". ")[0].trim();
      if (!/[.!?]$/.test(quote)) quote += ".";
      const paras = a.body.map((p) => `<p>${esc(p)}</p>`);
      const body = paras.slice(0, mid).join("") + (a.body.length > 2 ? `<figure class="pull" data-reveal><div class="pull__art" data-draw>${S.ART.sprig}</div><blockquote>${esc(quote)}</blockquote></figure>` : "") + paras.slice(mid).join("");
      const related = list.filter((x) => x.slug !== a.slug).sort((x, y) => (y.category === a.category) - (x.category === a.category)).slice(0, 3);

      root.innerHTML = `
      <article class="article">
        <header class="s art-head">
          <div class="wrap wrap--narrow">
            <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><a href="journal.html">Journal</a><span aria-hidden="true">/</span><span aria-current="page">${esc(a.category)}</span></nav>
            <span class="chip chip--olive">${esc(a.category)}</span>
            <h1 data-split>${esc(a.title)}</h1>
            <p class="art-head__meta">${esc(a.author)} · ${esc(a.date)} · ${esc(a.read)}</p>
          </div>
        </header>
        <figure class="art-hero wrap wrap--wide"><div class="art-hero__frame" data-parallax-root>${S.img(a.image, { eager: true, sizes: "(max-width: 960px) 100vw, 90vw", alt: a.title, attrs: 'data-parallax="6"' })}</div></figure>
        <div class="wrap wrap--narrow">
          <div class="art-body">${body}</div>
          <div class="art-foot">
            <a class="link-u" href="journal.html">${back} All articles</a>
            <div class="row"><span class="muted small">Share</span>
              <a class="icon-btn art-share" href="https://wa.me/?text=${encodeURIComponent(a.title + " — " + location.href)}" target="_blank" rel="noopener" aria-label="Share on WhatsApp">${FV.icon("whatsapp")}</a>
              <button class="btn btn--ghost btn--sm btn--noic" type="button" id="shareBtn">Copy link</button></div>
          </div>
        </div>
        ${shop.length || boxes.length ? `<section class="s sec band--kraft">
          <div class="wrap wrap--wide">
            <div class="head"><div class="head__main"><p class="eyebrow">Shop the story</p><h2 data-split>Everything on this <em class="i">table</em></h2></div>
              <div class="head__actions"><a class="link-u" href="products.html">Browse the market ${arrow}</a></div></div>
            <div class="rail-wrap"><div class="rail" data-cursor="Drag">${boxes.map(FV.boxCardHTML).join("")}${shop.slice(0, 8).map(FV.productCardHTML).join("")}</div><div class="rail-progress" aria-hidden="true"><i></i></div></div>
          </div></section>` : ""}
        <section class="s sec band--paper">
          <div class="wrap wrap--wide">
            <div class="head"><div class="head__main"><p class="eyebrow">Keep reading</p><h2 data-split>More from the <em class="i">Journal</em></h2></div>
              <div class="head__actions"><a class="link-u" href="journal.html">All entries ${arrow}</a></div></div>
            <div class="grid g-3 jgrid">${related.map((r) => FV.articleCardHTML(r)).join("")}</div>
          </div>
        </section>
      </article>`;

      document.getElementById("shareBtn").addEventListener("click", async () => {
        try {
          if (navigator.share) { await navigator.share({ title: a.title, text: a.excerpt, url: location.href }); return; }
          await navigator.clipboard.writeText(location.href);
          FV.toast("Link copied");
        } catch (_) {}
      });

      // Reading progress
      const bar = document.getElementById("readBar"), bodyEl = root.querySelector(".art-body");
      const prog = () => {
        const r = bodyEl.getBoundingClientRect(), h = r.height - innerHeight * 0.5;
        bar.style.transform = "scaleX(" + Math.min(1, Math.max(0, (-r.top + innerHeight * 0.3) / Math.max(1, h))) + ")";
      };
      addEventListener("scroll", prog, { passive: true }); prog();

      const ld = document.createElement("script");
      ld.type = "application/ld+json";
      ld.textContent = JSON.stringify({
        "@context": "https://schema.org", "@type": "Article", headline: a.title, description: a.excerpt,
        image: [new URL(FV.img(a.image), location.href).href], articleSection: a.category,
        author: { "@type": "Organization", name: a.author },
        publisher: { "@type": "Organization", name: "Fresh Valley", logo: { "@type": "ImageObject", url: new URL("assets/img/logo.png", location.href).href } },
      });
      document.head.appendChild(ld);
    })();
  </script>
  <script defer src="assets/vendor/gsap.min.js"></script>
  <script defer src="assets/vendor/ScrollTrigger.min.js"></script>
  <script defer src="assets/vendor/SplitText.min.js"></script>
  <script defer src="assets/vendor/lenis.min.js"></script>
  <script defer src="assets/js/motion.js"></script>
</body>
</html>
