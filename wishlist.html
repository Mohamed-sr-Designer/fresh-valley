<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Your Wishlist — Fresh Valley</title>
  <meta name="description" content="The produce and boxes you've saved for the right moment.">
  <meta name="theme-color" content="#19291C">
  <meta name="robots" content="noindex">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/fraunces-v4s.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/jakarta-s.woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/shop.css">
  <script>!function(d,w){var h=d.documentElement,L=0;if(/[?&](fv_preview|bake)=1/.test(location.search)||w.matchMedia("(prefers-reduced-motion: reduce)").matches)return;h.classList.add("m-on");try{if(!sessionStorage.getItem("fv_seen")){sessionStorage.setItem("fv_seen","1");h.classList.add("is-loading");L=1}}catch(e){}setTimeout(function(){if(!(w.FVMotion&&w.FVMotion.ready))h.classList.remove("m-on");h.classList.remove("is-loading","is-lifting")},L?5200:3500)}(document,window)</script>
</head>
<body data-page="wishlist">
  <!--loader--><div class="loader" aria-hidden="true"><div class="loader__in"><span class="loader__logo"></span><span class="loader__line"></span><span class="loader__note" id="fvLoadNote">Picked at first light</span></div></div><script>!function(){var d=new Date,m=d.getMonth(),s=new Date(d.getFullYear(),0,1),w=Math.ceil(((d-s)/864e5+s.getDay()+1)/7),n=[11,0,1].indexOf(m)>-1?"winter":m<5?"spring":m<8?"summer":"autumn",o={winter:11,spring:2,summer:5,autumn:8}[n],e=document.getElementById("fvLoadNote");e&&(e.textContent="Week "+w+" \u00b7 "+["Early","Mid","Late"][(m-o+12)%12]+" "+n+" in the valley")}()</script><!--/loader-->
  <div id="fv-header"></div>
  <noscript><p class="noscript">Fresh Valley uses JavaScript for its menu, basket and checkout. <a href="products.html">Browse the collection</a> · <a href="contact.html">Contact us</a></p></noscript>

  <main id="main">
    <section class="s shop-head">
      <div class="wrap wrap--wide">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span aria-current="page">Wishlist</span></nav>
        <div class="page-head">
          <div><p class="eyebrow">Saved for the right moment</p><h1>Your <em class="i">wishlist</em><span class="shop-head__count" id="headCount"></span></h1></div>
          <div class="page-head__side"><p class="lede">Everything you've hearted, in one place — ready when the moment is.</p>
            <div class="row"><button class="btn" type="button" id="addAll" hidden>Add all to basket<span class="btn__ic" id="addAllIc"></span></button></div></div>
        </div>
      </div>
    </section>

    <section class="s sec--flush-top" style="padding-bottom:var(--sec-sm)">
      <div class="wrap wrap--wide">
        <div class="grid-products" id="grid" aria-live="polite"></div>
        <div class="shop-empty" id="empty" hidden>
          <h2>Nothing saved <em class="i">yet</em>.</h2>
          <p class="muted">Tap the heart on anything you love — it'll wait for you here.</p>
          <a class="btn" href="products.html" style="margin-top:1.4rem">Browse the market<span class="btn__ic" id="emptyIc"></span></a>
        </div>
      </div>
    </section>

    <section class="s sec band--mist">
      <div class="wrap wrap--wide">
        <div class="head"><div class="head__main"><p class="eyebrow">Loved by our tables</p><h2 data-split>Best <em class="i">sellers</em></h2></div>
          <div class="head__actions"><a class="link-u" href="products.html?collection=best-sellers" id="bsAll">View all</a></div></div>
        <div class="rail-wrap"><div class="rail" id="rec"></div><div class="rail-progress" aria-hidden="true"><i></i></div></div>
      </div>
    </section>
  </main>

  <div id="fv-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/sections.js"></script>
  <script>
    (function () {
      const S = window.FVSections, I = FV.icon;
      const $ = (id) => document.getElementById(id);
      $("emptyIc").innerHTML = I("arrow");
      $("addAllIc").innerHTML = I("bag");
      $("bsAll").insertAdjacentHTML("beforeend", " " + I("arrow"));
      let busy = false, first = true;
      function render() {
        if (busy) return; busy = true; // updateWishUI re-fires fv:wish — guard the loop
        const items = FV.wish.items().map(FV.find).filter(Boolean);
        $("headCount").textContent = items.length || "";
        $("empty").hidden = items.length > 0;
        $("addAll").hidden = !items.length;
        $("grid").innerHTML = items.map(FV.productCardHTML).join("");
        FV.updateWishUI();
        if (!first) FV.observeReveals($("grid"));
        first = false; busy = false;
      }
      $("addAll").addEventListener("click", (e) => {
        const items = FV.wish.items().map(FV.find).filter((p) => p && !FV.soldOut(p));
        items.forEach((p) => { const dv = FV.defaultVariant(p); FV.cart.add({ key: p.slug + "|" + dv.variant, slug: p.slug, type: "product", name: p.name, image: FV.isCustomImg(p.image) ? p.image : p.slug, noPhoto: !!p.noPhoto, variant: dv.variant, price: dv.price }); });
        if (items.length) { FV.toast(items.length + " items added", "From your wishlist", true); if (window.FVMotion) FVMotion.fly(e.currentTarget); }
      });
      $("rec").innerHTML = FV.byCollection("best-sellers").slice(0, 10).map(FV.productCardHTML).join("");
      render();
      document.addEventListener("fv:wish", render);
    })();
  </script>
  <script defer src="assets/vendor/gsap.min.js"></script>
  <script defer src="assets/vendor/ScrollTrigger.min.js"></script>
  <script defer src="assets/vendor/SplitText.min.js"></script>
  <script defer src="assets/vendor/lenis.min.js"></script>
  <script defer src="assets/js/motion.js"></script>
</body>
</html>
