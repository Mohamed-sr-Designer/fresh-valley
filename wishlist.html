<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist — Fresh Valley</title>
  <meta name="theme-color" content="#1A2A1D">
  <meta name="description" content="Everything you have saved at Fresh Valley — your wishlist of export-grade fruit, vegetables and hosting boxes.">
  <meta name="robots" content="noindex">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/jost-400.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/cormorant-garamond-500.woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .wish-empty { padding: 3.5rem 1rem; }
    .wish-empty svg { width: 40px; height: 40px; color: var(--line-strong); margin: 0 auto 1.1rem; }
  </style>
</head>

<body data-page="wishlist">
  <div id="fv-header"></div>

  <main>
    <section class="page-header" style="padding-bottom: var(--s-6)">
      <div class="container">
        <nav class="breadcrumb"><a href="index.html">Home</a><span>/</span><span>Wishlist</span></nav>
        <div class="split-head">
          <h1>Saved for later</h1>
          <button class="btn btn--outline btn--sm" id="addAll" style="display:none">Add all to cart</button>
        </div>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="products-grid" id="grid"></div>
        <div class="empty-state wish-empty" id="empty" hidden>
          <span id="wishEmptyIcon" aria-hidden="true"></span>
          <h2 style="margin:.4rem 0 .3rem;font-size:var(--step-1)">Nothing saved yet</h2>
          <p style="font-size:var(--step--1)">Tap the heart on anything you love, and it will wait for you here.</p>
          <a class="btn btn--sm" href="products.html" style="margin-top:1.2rem">Browse the collection
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        </div>
      </div>
    </section>

    <!-- Recommendations -->
    <section class="section section--paper2" id="recSection">
      <div class="container">
        <div class="section-head" data-reveal style="margin-bottom: var(--s-7)">
          <p class="eyebrow">You may also love</p>
          <h2 class="title" style="font-size:var(--step-2)">From our best sellers</h2>
        </div>
        <div class="products-grid" id="rec"></div>
      </div>
    </section>
  </main>

  <div id="fv-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      const grid = document.getElementById("grid");
      const empty = document.getElementById("empty");
      const addAll = document.getElementById("addAll");
      document.getElementById("wishEmptyIcon").innerHTML = FV.icon("heart");

      let rendering = false;
      function render() {
        if (rendering) return;            // updateWishUI() re-fires fv:wish — guard the loop
        rendering = true;
        const slugs = FV.wish.items();
        const items = slugs.map(FV.find).filter(Boolean);
        if (!items.length) {
          grid.innerHTML = ""; empty.hidden = false; addAll.style.display = "none";
        } else {
          empty.hidden = true;
          addAll.style.display = "";
          grid.innerHTML = items.map(FV.productCardHTML).join("");
          FV.updateWishUI(); FV.observeReveals();
        }
        rendering = false;
      }

      addAll.addEventListener("click", () => {
        FV.wish.items().map(FV.find).filter(Boolean).forEach(p => FV.quickAdd(p.slug));
      });

      // Recommendations
      document.getElementById("rec").innerHTML =
        FV.byCollection("best-sellers").slice(0, 4).map(FV.productCardHTML).join("");

      render();
      document.addEventListener("fv:wish", render);
      FV.observeReveals(); FV.updateWishUI();
    })();
  </script>
</body>
</html>
