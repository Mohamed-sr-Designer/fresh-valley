<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Checkout — Fresh Valley</title>
  <meta name="description" content="Secure checkout — choose a next-day delivery slot and how you'd like to pay.">
  <meta name="theme-color" content="#19291C">
  <meta name="robots" content="noindex">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/fraunces-v4s.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/jakarta-s.woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/shop.css">
  <script>!function(d,w){var h=d.documentElement;if(!/[?&]fv_preview=1/.test(location.search)&&!w.matchMedia("(prefers-reduced-motion: reduce)").matches){h.classList.add("m-on");setTimeout(function(){if(!(w.FVMotion&&w.FVMotion.ready))h.classList.remove("m-on")},3500)}}(document,window)</script>
</head>
<body data-page="checkout">
  <div id="fv-header"></div>
  <noscript><p class="noscript">Fresh Valley uses JavaScript for its menu, basket and checkout. <a href="products.html">Browse the collection</a> · <a href="contact.html">Contact us</a></p></noscript>

  <main id="main">
    <section class="s shop-head">
      <div class="wrap wrap--wide">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><a href="cart.html">Basket</a><span aria-hidden="true">/</span><span aria-current="page" id="coCrumb">Checkout</span></nav>
        <div class="page-head">
          <div><p class="eyebrow" id="coEyebrow">Secure checkout</p><h1 id="coTitle">Nearly <em class="i">there</em>.</h1></div>
          <div class="page-head__side"><ol class="steps-bar" id="stepsBar" aria-label="Checkout progress"></ol></div>
        </div>
      </div>
    </section>
    <section class="s sec--flush-top" style="padding-bottom:var(--sec-sm)">
      <div class="wrap wrap--wide" id="coRoot"></div>
    </section>
  </main>

  <div id="fv-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/sections.js"></script>
  <script>
    (function () {
      const S = window.FVSections, esc = FV.esc, I = FV.icon;
      const root = document.getElementById("coRoot");
      const SET = FV.settings;
      const AREAS = (window.FVTheme && FVTheme.settings().areas) || ["New Cairo", "Sheikh Zayed", "October", "Madinaty", "Rehab"];
      const readJSON = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } };
      let user = readJSON("fv_user");
      const nameParts = (n) => { const p = (n || "").trim().split(/\s+/); return { first: p[0] || "", last: p.slice(1).join(" ") }; };
      const savedCard = () => { const l = readJSON("fv_cards") || []; return l.find((c) => c.default) || l[0] || null; };
      const savedAddr = () => { const l = readJSON("fv_addresses") || []; return l.find((a) => a.default) || l[0] || null; };
      const code = () => { try { return sessionStorage.getItem("fv_code") || ""; } catch (_) { return ""; } };
      const state = { mode: user ? "account" : "guest", payment: user && savedCard() ? "saved" : "card", day: 0, time: 1 };
      const slots = (SET.slots && SET.slots.length ? SET.slots : ["Morning · 9–12", "Midday · 12–3", "Afternoon · 3–6", "Evening · 6–9"]);
      const days = (() => { const out = []; const now = new Date(); const start = now.getHours() >= (SET.cutoffHour || 18) ? 2 : 1; for (let i = start; i < start + 4; i++) { const d = new Date(); d.setDate(d.getDate() + i); out.push({ top: d.toLocaleDateString("en-GB", { weekday: "short" }), day: d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) }); } return out; })();
      const steps = (active) => ["Basket", "Details", "Delivery", "Payment"].map((s, i) => `<li class="${i < active ? "is-done" : i === active ? "is-on" : ""}"><b>${i < active ? I("check") : i + 1}</b>${s}</li>`).join("");

      if (!FV.cart.items().length) {
        document.getElementById("stepsBar").innerHTML = steps(0);
        root.innerHTML = `<div class="shop-empty"><div class="empty__art">${S.ART.sprig}</div><h2>Your basket is <em class="i">empty</em>.</h2><p class="muted">Add something lovely before checking out.</p><a class="btn" href="products.html" style="margin-top:1.4rem">Browse the market<span class="btn__ic">${I("arrow")}</span></a></div>`;
        return;
      }
      FV.track("checkout_start", { value: FV.cart.subtotal() });
      document.getElementById("stepsBar").innerHTML = steps(1);

      function totals() {
        const sub = FV.cart.subtotal();
        const delivery = sub >= SET.freeThreshold ? 0 : SET.deliveryFee;
        const d = FV.discounts.find(code());
        const off = d ? FV.discounts.value(d, sub, delivery) : 0;
        return { sub, delivery, d, off, total: Math.max(0, sub + delivery - off) };
      }
      function summaryHTML() {
        const t = totals();
        return `<aside class="co-summary" aria-labelledby="coSum">
          <h2 id="coSum">Your order</h2>
          <div class="co-items">${FV.cart.items().map((it) => `<div class="co-item">
            <span class="co-item__img">${it.noPhoto ? I("leaf2") : `<img src="${esc(FV.imgSrc(it.image))}" alt="" loading="lazy" width="56" height="56">`}<b>${it.qty}</b></span>
            <span><span class="co-item__n">${esc(it.name)}</span><br><span class="co-item__v">${esc(it.variant)}</span></span>
            <span class="co-item__p">${FV.money(it.price * it.qty)}</span></div>`).join("")}</div>
          <div class="sum-row"><span>Subtotal</span><strong>${FV.money(t.sub)}</strong></div>
          ${t.d ? `<div class="sum-row sum-row--saving"><span>Discount · ${esc(t.d.code)}</span><strong>− ${FV.money(t.off)}</strong></div>` : ""}
          <div class="sum-row"><span>Delivery</span><span>${t.delivery ? FV.money(t.delivery) : "Free"}</span></div>
          <div class="sum-row sum-row--total"><span>Total</span><span id="sumTotal">${FV.money(t.total)}</span></div>
          ${t.delivery ? `<p class="muted-note">Add ${FV.money(SET.freeThreshold - t.sub)} more for complimentary delivery — <a class="link-btn" href="cart.html">edit basket</a>.</p>` : ""}
          <ul class="trust" style="margin-top:.8rem"><li>${I("shield")}<span>Not perfect? We replace it — no debate.</span></li><li>${I("snow")}<span>Cold-chain kept to your door.</span></li></ul>
        </aside>`;
      }
      function field(id, name, label, o) {
        o = o || {};
        const req = o.required !== false;
        return `<div class="field${o.span ? " span" : ""}">
          <label for="${id}">${label}${req ? "" : ` <span class="muted">(optional)</span>`}</label>
          <input class="input" id="${id}" name="${name}" type="${o.type || "text"}"${o.auto ? ` autocomplete="${o.auto}"` : ""}${o.mode ? ` inputmode="${o.mode}"` : ""}${o.ph ? ` placeholder="${o.ph}"` : ""} value="${esc(o.value || "")}"${req ? ` required aria-describedby="${id}-m"` : ""}${o.pattern ? ` pattern="${o.pattern}"` : ""}>
          ${req ? `<p class="field-msg" id="${id}-m" aria-live="polite"></p>` : ""}</div>`;
      }
      function render() {
        const card = savedCard(), addr = savedAddr();
        const np = nameParts(user && user.name);
        const pays = [
          state.mode === "account" && card ? ["saved", `${esc((card.brand || "Card").replace(/^./, (c) => c.toUpperCase()))} ending ${esc(card.last4)}`, FV.payMark(card.brand || "visa")] : null,
          ["card", "Credit or debit card", FV.payMark("visa") + FV.payMark("mastercard")],
          ["apple", "Apple Pay", FV.payMark("apple")],
          ["wallet", "Mobile wallet", FV.payMark("wallet")],
          SET.codEnabled !== false ? ["cod", "Cash on delivery", FV.payMark("cod")] : null,
        ].filter(Boolean);
        if (!pays.some((p) => p[0] === state.payment)) state.payment = "card";
        root.innerHTML = `
        <div class="co">
          <div class="co__main">
            <div class="co-mode" role="group" aria-label="Checkout as">
              <button type="button" data-mode="guest" aria-pressed="${state.mode === "guest"}">Guest checkout</button>
              <button type="button" data-mode="account" aria-pressed="${state.mode === "account"}">${user ? "My account" : "Sign in"}</button>
            </div>
            ${state.mode === "account" ? (user ? `<div class="demo-note">${I("check")}<span>Signed in as <strong>${esc(user.name)}</strong> · ${esc(user.email)} — <button type="button" class="link-btn" id="coOut">sign out</button></span></div>`
              : `<div class="co-step"><div class="co-grid">
                  <div class="field"><label for="siEmail">Email</label><input class="input" id="siEmail" type="email" autocomplete="email" placeholder="you@email.com"></div>
                  <div class="field"><label for="siPass">Password</label><input class="input" id="siPass" type="password" autocomplete="current-password" placeholder="••••••••"></div></div>
                  <div class="row" style="margin-top:1rem"><button type="button" class="btn btn--ghost btn--sm" id="siBtn">Sign in &amp; continue<span class="btn__ic">${I("arrow")}</span></button><span class="muted-note">Demo — any email &amp; password works.</span></div></div>`) : ""}
            <form id="coForm" novalidate>
              <div class="co__main">
                <div class="co-step">
                  <div class="co-step__head"><span class="co-step__n">1</span><h2>Contact <em class="i">&amp; address</em></h2></div>
                  <div class="co-grid">
                    ${field("coFirst", "first", "First name", { auto: "given-name", value: np.first })}
                    ${field("coLast", "last", "Last name", { auto: "family-name", value: np.last })}
                    ${field("coPhone", "phone", "Phone", { auto: "tel", mode: "tel", ph: "+20 1XX XXX XXXX", type: "tel", value: user && user.phone, pattern: "[0-9+\\s\\(\\)\\-]{8,}" })}
                    ${field("coEmail", "email", "Email", { type: "email", auto: "email", value: user && user.email })}
                    <div class="field"><label for="coArea">Area</label><select class="select" id="coArea" name="area" required autocomplete="address-level2" aria-describedby="coArea-m"><option value="">Select your area</option>${AREAS.map((a) => `<option${addr && String(addr.area || "").indexOf(a) === 0 ? " selected" : ""}>${esc(a)}</option>`).join("")}</select><p class="field-msg" id="coArea-m" aria-live="polite"></p></div>
                    ${field("coDistrict", "district", "Compound / district", { required: false, auto: "address-line2" })}
                    ${field("coStreet", "street", "Street address", { ph: "Building, street, apartment", auto: "address-line1", span: true, value: addr && addr.line })}
                    ${field("coNotes", "notes", "Delivery notes", { required: false, ph: "Gate code, landmark, anything that helps", span: true })}
                  </div>
                </div>
                <div class="co-step">
                  <div class="co-step__head"><span class="co-step__n">2</span><h2>Delivery <em class="i">slot</em></h2></div>
                  <p class="slot-label" id="dayLab">Choose a day</p>
                  <div class="slot-grid" role="group" aria-labelledby="dayLab">${days.map((d, i) => `<button type="button" class="slot" data-day="${i}" aria-pressed="${i === state.day}"><small>${d.top}</small><b>${d.day}</b></button>`).join("")}</div>
                  <p class="slot-label" id="timeLab">Choose a time</p>
                  <div class="slot-grid" role="group" aria-labelledby="timeLab">${slots.map((t, i) => { const [a, b] = String(t).split("·").map((x) => x.trim()); return `<button type="button" class="slot" data-time="${i}" aria-pressed="${i === state.time}"><b>${esc(b || a)}</b><small>${esc(b ? a : "")}</small></button>`; }).join("")}</div>
                </div>
                <div class="co-step">
                  <div class="co-step__head"><span class="co-step__n">3</span><h2>Payment</h2></div>
                  <div class="pay-opts" role="group" aria-label="Payment method">${pays.map((p) => `<button type="button" class="pay-opt" data-pay="${p[0]}" aria-pressed="${state.payment === p[0]}"><span class="dotr" aria-hidden="true"></span><span>${p[1]}</span><span class="pay-opt__marks">${p[2]}</span></button>`).join("")}</div>
                  <div class="card-fields${state.payment === "card" ? " show" : ""}" id="cardFields">
                    <div class="co-grid">
                      <div class="field span"><label for="ccNum">Card number</label><input class="input" id="ccNum" inputmode="numeric" placeholder="•••• •••• •••• ••••" autocomplete="off"></div>
                      <div class="field"><label for="ccExp">Expiry</label><input class="input" id="ccExp" placeholder="MM / YY" autocomplete="off"></div>
                      <div class="field"><label for="ccCvc">CVC</label><input class="input" id="ccCvc" inputmode="numeric" placeholder="•••" autocomplete="off"></div>
                    </div>
                  </div>
                  <div class="demo-note">${I("shield")}<span>Demo store — no payment is taken and card details are never stored or sent. In production this step is handled by a certified payment provider.</span></div>
                </div>
                <div class="co-step">
                  <div class="co-step__head"><span class="co-step__n">4</span><h2>Review <em class="i">&amp; place</em></h2></div>
                  <label class="check"><input type="checkbox" id="coNews" checked><span>Send me the Fresh Valley Letter — one quiet note a month.</span></label>
                  <p class="muted small" style="margin-top:.8rem">By placing your order you agree to our <a class="link-btn" href="terms.html">Terms of Use</a> and <a class="link-btn" href="policies.html">Company Policies</a>.</p>
                  <button class="btn btn--lg btn--block" type="submit" id="placeBtn" style="margin-top:1.2rem" data-magnetic=".12">Place order · <span id="placeTotal"></span><span class="btn__ic">${I("arrow")}</span></button>
                </div>
              </div>
            </form>
          </div>
          ${summaryHTML()}
        </div>`;
        wire();
      }
      const REQ = [["coFirst", "Enter your first name."], ["coLast", "Enter your last name."], ["coPhone", "Enter a valid phone number."], ["coEmail", "Enter a valid email address."], ["coArea", "Select your delivery area."], ["coStreet", "Enter your street address."]];
      function validate() {
        let first = null;
        REQ.forEach(([id, msg]) => {
          const el = document.getElementById(id); if (!el) return;
          const bad = !el.checkValidity() || !String(el.value).trim();
          el.closest(".field").classList.toggle("has-error", bad);
          el.setAttribute("aria-invalid", String(bad));
          const m = document.getElementById(id + "-m"); if (m) m.textContent = bad ? msg : "";
          if (bad && !first) first = el;
        });
        return first;
      }
      function wire() {
        document.getElementById("placeTotal").textContent = FV.money(totals().total);
        root.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => { state.mode = b.dataset.mode; render(); }));
        const si = document.getElementById("siBtn");
        if (si) si.addEventListener("click", () => {
          const email = (document.getElementById("siEmail").value || "").trim();
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { document.getElementById("siEmail").focus(); FV.toast("Enter a valid email to sign in"); return; }
          const name = email.split("@")[0].replace(/[._-]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
          localStorage.setItem("fv_user", JSON.stringify({ name, email }));
          user = readJSON("fv_user"); state.payment = savedCard() ? "saved" : "card";
          FV.toast("Signed in as " + name.split(" ")[0]); render();
        });
        const so = document.getElementById("coOut");
        if (so) so.addEventListener("click", () => { localStorage.removeItem("fv_user"); user = null; state.mode = "guest"; state.payment = "card"; render(); });
        const pick = (sel, key) => root.querySelectorAll(sel).forEach((b) => b.addEventListener("click", () => {
          state[key] = +b.dataset[key]; root.querySelectorAll(sel).forEach((x) => x.setAttribute("aria-pressed", x === b));
          document.getElementById("stepsBar").innerHTML = steps(2);
        }));
        pick("[data-day]", "day"); pick("[data-time]", "time");
        root.querySelectorAll("[data-pay]").forEach((b) => b.addEventListener("click", () => {
          state.payment = b.dataset.pay;
          root.querySelectorAll("[data-pay]").forEach((x) => x.setAttribute("aria-pressed", x === b));
          document.getElementById("cardFields").classList.toggle("show", state.payment === "card");
          document.getElementById("stepsBar").innerHTML = steps(3);
        }));
        document.getElementById("coForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const bad = validate();
          if (bad) { bad.focus(); FV.toast("Please check the highlighted fields"); return; }
          place(e.target);
        });
        FV.observeReveals(root);
      }
      async function place(form) {
        const btn = document.getElementById("placeBtn");
        btn.disabled = true; btn.querySelector("span").textContent = "…";
        const t = totals();
        const slot = days[state.day].top + " " + days[state.day].day + ", " + slots[state.time];
        const card = savedCard();
        const payLabel = { card: "Card", saved: card ? (card.brand || "Card").replace(/^./, (c) => c.toUpperCase()) + " ending " + card.last4 : "Saved card", apple: "Apple Pay", wallet: "Mobile wallet", cod: "Cash on delivery" }[state.payment];
        const customer = { name: (form.first.value + " " + form.last.value).trim(), email: form.email.value.trim(), phone: form.phone.value.trim(), area: form.area.value || "" };
        const address = [form.street.value, form.district.value, form.area.value].map((x) => x.trim()).filter(Boolean).join(", ");
        const items = FV.cart.items().map((it) => ({ slug: it.slug, type: it.type, name: it.name, variant: it.variant, price: it.price, qty: it.qty, image: it.image, noPhoto: !!it.noPhoto, note: it.note || "" }));
        let order = {
          id: "FV" + Math.floor(100000 + Math.random() * 899999), date: new Date().toISOString(),
          customer, address, slot, items, subtotal: t.sub, discount: t.off, code: t.d ? t.d.code : "", delivery: t.delivery, total: t.total,
          payment: payLabel, status: "new", fulfillment: "unfulfilled", note: form.notes.value.trim(), channel: "Website",
          timeline: [{ t: Date.now(), msg: "Order placed on the website" }],
        };
        let placed = false;
        if (FV.api && await FV.api.up()) {
          try { order = await FV.api.checkout({ customer, address, slot, payment: payLabel, code: order.code, items: items.map((i) => ({ slug: i.slug, qty: i.qty, variant: i.variant })) }); placed = true; }
          catch (_) { FV.toast("Couldn't reach the server — saved locally"); }
        }
        if (!placed) { FV.orders.record(order); }
        FV.clients.upsert(Object.assign({}, customer, { status: "active", marketing: document.getElementById("coNews").checked }));
        FV.cart.clear();
        try { sessionStorage.removeItem("fv_code"); } catch (_) {}
        confirmView(order, customer.name.split(" ")[0] || "there");
      }
      function confirmView(o, first) {
        document.getElementById("stepsBar").innerHTML = steps(4);
        document.getElementById("coTitle").innerHTML = "Thank you, <em class=\"i\">" + esc(first) + "</em>.";
        document.getElementById("coEyebrow").textContent = "Order confirmed";
        document.getElementById("coCrumb").textContent = "Confirmed";
        root.innerHTML = `<div class="conf" role="status">
          <div class="conf__tick">${I("check")}</div>
          <p class="eyebrow" style="justify-content:center">Order ${esc(o.id)}</p>
          <h2>Your table is <em class="i">on its way</em>.</h2>
          <p class="lede" style="margin:0 auto">We've received your order and started grading your produce. A confirmation is on its way to ${esc(o.customer.email)}.</p>
          <div class="conf__meta">
            <div><small>Order</small><b>${esc(o.id)}</b></div>
            <div><small>Delivery</small><b>${esc(o.slot)}</b></div>
            <div><small>Payment</small><b>${esc(o.payment)}</b></div>
            <div><small>Total</small><b>${FV.money(o.total)}</b></div>
          </div>
          <div class="conf__actions">
            <a class="btn" href="account.html#orders">Track this order<span class="btn__ic">${I("arrow")}</span></a>
            <button class="btn btn--ghost" type="button" id="rcOpen">View receipt<span class="btn__ic">${I("check")}</span></button>
            <button class="btn btn--ghost btn--noic" type="button" id="rcDl">Download</button>
          </div>
          <div class="conf__art" data-draw>${S.ART.bouquet}</div>
        </div>`;
        document.getElementById("rcOpen").addEventListener("click", () => FV.receipt.open(o));
        document.getElementById("rcDl").addEventListener("click", () => FV.receipt.download(o));
        if (window.FVMotion && FVMotion.lenis) FVMotion.lenis.scrollTo(0, { duration: 1.2 }); else window.scrollTo({ top: 0, behavior: "smooth" });
        document.querySelectorAll(".toast").forEach((t) => t.remove());
        FV.observeReveals(root);
      }
      render();
    })();
  </script>
  <script defer src="assets/vendor/gsap.min.js"></script>
  <script defer src="assets/vendor/ScrollTrigger.min.js"></script>
  <script defer src="assets/vendor/SplitText.min.js"></script>
  <script defer src="assets/vendor/lenis.min.js"></script>
  <script defer src="assets/js/motion.js"></script>
</body>
</html>
