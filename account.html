<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Account — Fresh Valley</title>
  <meta name="description" content="Track orders, save favourites, reorder in a tap and manage your delivery addresses.">
  <meta name="theme-color" content="#19291C">
  <meta name="robots" content="noindex">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/fraunces-v4s.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/jakarta-s.woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/shop.css">
  <script>!function(d,w){var h=d.documentElement;if(!/[?&]fv_preview=1/.test(location.search)&&!w.matchMedia("(prefers-reduced-motion: reduce)").matches){h.classList.add("m-on");setTimeout(function(){if(!(w.FVMotion&&w.FVMotion.ready))h.classList.remove("m-on")},3500)}}(document,window)</script>
</head>
<body data-page="account">
  <div id="fv-header"></div>
  <noscript><p class="noscript">Fresh Valley uses JavaScript for its menu, basket and checkout. <a href="products.html">Browse the collection</a> · <a href="contact.html">Contact us</a></p></noscript>

  <main id="main">
    <section class="s shop-head">
      <div class="page-head__art" id="headArt" data-draw aria-hidden="true"></div>
      <div class="wrap wrap--wide">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span aria-current="page" id="acctCrumb">My account</span></nav>
        <div class="page-head">
          <div><p class="eyebrow" id="acctEyebrow">Your Fresh Valley</p><h1 id="acctTitle">My <em class="i">account</em></h1></div>
          <div class="page-head__side"><p class="lede" id="acctLede">Orders, favourites and the details that get your produce to the right door.</p></div>
        </div>
      </div>
    </section>
    <section class="s sec--flush-top" style="padding-bottom:var(--sec-sm)">
      <div class="wrap wrap--wide" id="acctRoot"></div>
    </section>
  </main>

  <div id="fv-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/sections.js"></script>
  <script>
    (function () {
      const S = window.FVSections, esc = FV.esc, I = FV.icon;
      const root = document.getElementById("acctRoot");
      const $ = (id) => document.getElementById(id);
      const store = { get(k, fb) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (_) { return fb; } }, set(k, v) { localStorage.setItem(k, JSON.stringify(v)); } };
      $("headArt").innerHTML = S.ART.fig;
      const stored = store.get("fv_user", null);
      if (!stored) return gate();

      /* ============================ DASHBOARD ============================ */
      const user = { name: stored.name || "Guest", email: stored.email || "", phone: stored.phone || "" };
      user.first = user.name.split(" ")[0];
      $("acctTitle").innerHTML = `Hello, <em class="i">${esc(user.first)}</em>.`;
      $("acctLede").textContent = "Orders, favourites and the details that get your produce to the right door.";

      const STEPS = ["new", "confirmed", "packed", "out", "delivered"];
      const LABEL = { new: "Received", confirmed: "Confirmed", packed: "Packed", out: "Out for delivery", delivered: "Delivered", cancelled: "Cancelled", refunded: "Refunded", pending: "Received", transit: "Out for delivery" };
      const real = FV.orders.all().filter((o) => o.customer && o.customer.email && o.customer.email.toLowerCase() === user.email.toLowerCase());
      const sampleItems = [["strawberry", "red-grapes", "medjool-dates"], ["orange", "carrot", "tomato", "cucumber"], ["mango", "green-grapes", "banana"]];
      const samples = sampleItems.map((sl, i) => {
        const items = sl.map(FV.find).filter(Boolean).map((p) => { const v = FV.defaultVariant(p); return { slug: p.slug, type: "product", name: p.name, variant: v.variant, price: v.price, qty: 1, image: p.slug }; });
        const sub = items.reduce((s, x) => s + x.price, 0), del = sub >= FV.settings.freeThreshold ? 0 : FV.settings.deliveryFee;
        const d = new Date(); d.setDate(d.getDate() - [2, 12, 26][i]);
        return { id: ["FV204881", "FV198450", "FV191207"][i], date: d.toISOString(), status: ["out", "delivered", "delivered"][i], sample: true, items, subtotal: sub, delivery: del, total: sub + del, slot: i === 0 ? "Tomorrow, 3–6" : "", payment: "Card", customer: { name: user.name, email: user.email, phone: user.phone, area: "New Cairo" }, address: "New Cairo" };
      });
      const orders = (real.length ? real : samples).slice().sort((a, b) => new Date(b.date) - new Date(a.date));
      const spent = orders.filter((o) => o.status !== "cancelled" && o.status !== "refunded").reduce((s, o) => s + (o.total || 0), 0);

      const NAV = [["overview", "home", "Overview"], ["orders", "bag", "Orders"], ["reorder", "truck", "Reorder"], ["wishlist", "heart", "Wishlist"], ["addresses", "pin", "Addresses"], ["profile", "user", "Profile"], ["settings", "sparkle", "Preferences"]];
      root.innerHTML = `<div class="acct">
        <nav class="acct__nav" aria-label="Account">
          <div class="acct__greet"><span class="acct__av">${esc(user.name.split(" ").map((w) => w[0]).slice(0, 2).join(""))}</span><span><strong>${esc(user.name)}</strong><small>${esc(user.email)}</small></span></div>
          ${NAV.map((n) => `<button type="button" data-tab="${n[0]}">${I(n[1])}${n[2]}</button>`).join("")}
          <button type="button" class="acct__out" id="signOut">${I("arrowL")}Sign out</button>
        </nav>
        <div id="panels">
          <section class="acct__panel" data-panel="overview" aria-labelledby="h-ov"><h2 id="h-ov">Overview</h2>
            <div class="acct__stats"><div><small>Orders</small><b>${orders.length}</b></div><div><small>Total spent</small><b>${FV.money(spent)}</b></div><div><small>Saved items</small><b id="wishStat">${FV.wish.items().length}</b></div></div>
            ${orders[0] ? orderCard(orders[0], true) : ""}
            <div class="host-rec"><div class="host-rec__img">${S.img("pepper-medley", { sizes: "220px", alt: "" })}</div><div><p class="eyebrow">For your next gathering</p><h3>The Hosting <em class="i">Box</em></h3><p>Fruit, dates and a finishing herb — arranged, wrapped and ready for guests.</p></div><a class="btn btn--olive" href="product.html?box=hosting-box">Explore<span class="btn__ic">${I("arrow")}</span></a></div>
          </section>
          <section class="acct__panel" data-panel="orders" aria-labelledby="h-or"><h2 id="h-or">Orders</h2>
            ${real.length ? "" : `<div class="demo-note">${I("sparkle")}<span>Sample orders shown — your real orders appear here as soon as you check out with ${esc(user.email)}.</span></div>`}
            ${orders.map((o) => orderCard(o)).join("")}
          </section>
          <section class="acct__panel" data-panel="reorder" aria-labelledby="h-re"><h2 id="h-re">Reorder</h2>
            ${orders[0] ? `<div class="box-card row" style="justify-content:space-between"><div><strong class="cart-line__name">Your last order</strong><div class="muted small">${esc(orders[0].id)} · ${orders[0].items.length} items</div></div><button class="btn btn--sm" type="button" data-reorder="${esc(orders[0].id)}">Add all to basket<span class="btn__ic">${I("bag")}</span></button></div>` : ""}
            <p class="eyebrow">Your regulars</p>
            <div class="grid-products" id="regulars"></div>
          </section>
          <section class="acct__panel" data-panel="wishlist" aria-labelledby="h-wi"><h2 id="h-wi">Wishlist</h2><div id="wishMini"></div></section>
          <section class="acct__panel" data-panel="addresses" aria-labelledby="h-ad"><h2 id="h-ad">Addresses</h2><div id="addrBox"></div></section>
          <section class="acct__panel" data-panel="profile" aria-labelledby="h-pr"><h2 id="h-pr">Profile</h2><div id="profileBox"></div></section>
          <section class="acct__panel" data-panel="settings" aria-labelledby="h-se"><h2 id="h-se">Preferences</h2>
            <div class="box-card" id="prefs"></div>
          </section>
        </div>
      </div>`;

      function orderCard(o, compact) {
        const st = o.status === "pending" ? "new" : o.status === "transit" ? "out" : o.status;
        const idx = STEPS.indexOf(st);
        const date = new Date(o.date).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
        return `<article class="order-card">
          <div class="order-card__head"><div><div class="order-card__id">${esc(o.id)}</div><div class="order-card__meta">${date}${o.slot && idx > -1 && idx < 4 ? " · arriving " + esc(o.slot) : ""}</div></div>
            <span class="status-chip status-chip--${esc(st)}">${esc(LABEL[st] || st)}</span></div>
          ${idx > -1 ? `<div class="tracker" aria-label="Progress: ${esc(LABEL[st])}">${STEPS.map((s, i) => `<i class="${i <= idx ? "on" : ""}"></i>`).join("")}</div>` : ""}
          ${compact ? "" : `<div class="order-card__thumbs">${(o.items || []).slice(0, 8).map((it) => `<span title="${esc(it.name)}">${it.noPhoto ? I("leaf2") : `<img src="${esc(FV.imgSrc(it.image || it.slug))}" alt="${esc(it.name)}" loading="lazy" width="54" height="54">`}</span>`).join("")}</div>`}
          <div class="order-card__foot"><span class="order-card__total">${FV.money(o.total)}</span>
            <div class="row"><button class="btn btn--ghost btn--sm btn--noic" type="button" data-receipt="${esc(o.id)}">Receipt</button><button class="btn btn--sm" type="button" data-reorder="${esc(o.id)}">Reorder<span class="btn__ic">${I("bag")}</span></button></div></div>
        </article>`;
      }
      // Regulars = most-ordered products across this customer's orders
      (function () {
        const count = {};
        orders.forEach((o) => (o.items || []).forEach((it) => { if (it.type !== "box") count[it.slug] = (count[it.slug] || 0) + (it.qty || 1); }));
        let regs = Object.keys(count).sort((a, b) => count[b] - count[a]).map(FV.find).filter(Boolean);
        if (regs.length < 4) regs = regs.concat(FV.byCollection("best-sellers").filter((p) => !regs.includes(p)));
        $("regulars").innerHTML = regs.slice(0, 8).map(FV.productCardHTML).join("");
      })();
      function renderWish() {
        const items = FV.wish.items().map(FV.find).filter(Boolean);
        $("wishStat").textContent = items.length;
        $("wishMini").innerHTML = items.length ? `<div class="grid-products">${items.slice(0, 12).map(FV.productCardHTML).join("")}</div>`
          : `<div class="shop-empty"><div class="empty__art">${S.ART.strawberry}</div><h2>Nothing saved <em class="i">yet</em>.</h2><a class="btn btn--sm" href="products.html" style="margin-top:1rem">Browse the market<span class="btn__ic">${I("arrow")}</span></a></div>`;
        FV.updateWishUI();
      }
      /* ---- profile ---- */
      const np = user.name.split(/\s+/);
      const profile = () => store.get("fv_profile", { first: np[0] || user.first, last: np.slice(1).join(" "), email: user.email, phone: user.phone || "" });
      const gv = (id) => { const e = $(id); return e ? String(e.value).trim() : ""; };
      function renderProfile(edit) {
        const p = profile(), b = $("profileBox");
        if (edit) {
          b.innerHTML = `<form class="box-card" id="pfForm"><div class="addr-grid">
            <div class="field"><label for="pf_first">First name</label><input class="input" id="pf_first" value="${esc(p.first)}" autocomplete="given-name"></div>
            <div class="field"><label for="pf_last">Last name</label><input class="input" id="pf_last" value="${esc(p.last)}" autocomplete="family-name"></div>
            <div class="field"><label for="pf_email">Email</label><input class="input" id="pf_email" type="email" value="${esc(p.email)}" autocomplete="email"></div>
            <div class="field"><label for="pf_phone">Phone</label><input class="input" id="pf_phone" type="tel" value="${esc(p.phone)}" autocomplete="tel"></div></div>
            <div class="row" style="margin-top:1.2rem"><button class="btn btn--sm" type="submit">Save changes<span class="btn__ic">${I("check")}</span></button><button class="btn btn--ghost btn--sm btn--noic" type="button" id="pfCancel">Cancel</button></div></form>`;
          $("pfForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const n = { first: gv("pf_first") || p.first, last: gv("pf_last"), email: gv("pf_email") || p.email, phone: gv("pf_phone") };
            store.set("fv_profile", n);
            const u = store.get("fv_user", {}); u.name = (n.first + " " + n.last).trim() || u.name; u.email = n.email || u.email; u.phone = n.phone; store.set("fv_user", u);
            FV.clients.upsert({ name: u.name, email: u.email, phone: n.phone });
            FV.toast("Profile saved"); renderProfile(false);
          });
          $("pfCancel").addEventListener("click", () => renderProfile(false));
        } else {
          b.innerHTML = `<div class="box-card"><div class="addr-grid">
            ${[["First name", p.first], ["Last name", p.last], ["Email", p.email], ["Phone", p.phone]].map(([k, v]) => `<div class="static-field"><span>${k}</span><b>${esc(v) || "—"}</b></div>`).join("")}</div>
            <button class="btn btn--ghost btn--sm btn--noic" type="button" id="pfEdit" style="margin-top:1.2rem">Edit details</button></div>`;
          $("pfEdit").addEventListener("click", () => renderProfile(true));
        }
      }
      /* ---- addresses ---- */
      let addrs = store.get("fv_addresses", [
        { id: 1, label: "Home", line: "Villa 22, South Lake", area: "New Cairo, Cairo", default: true },
        { id: 2, label: "Office", line: "Building 4, Beverly Hills", area: "Sheikh Zayed, Giza", default: false }]);
      let geo = null;
      const mapSrc = (q) => "https://maps.google.com/maps?q=" + encodeURIComponent(q) + "&z=14&output=embed";
      function renderAddr(editId) {
        const b = $("addrBox");
        let html = addrs.length ? `<div class="addr-grid">${addrs.map((a) => `<div class="addr"><div class="addr__top"><strong>${esc(a.label)}</strong>${a.default ? `<span class="status-chip status-chip--delivered">Default</span>` : `<button type="button" class="link-btn" data-adef="${a.id}">Set default</button>`}</div>
          <p>${esc(a.line)}<br>${esc(a.area)}</p>
          <div class="addr__acts"><button type="button" class="link-btn" data-aedit="${a.id}">Edit</button><button type="button" class="link-btn" data-arem="${a.id}">Remove</button>${a.geo ? `<a class="link-btn" target="_blank" rel="noopener" href="https://maps.google.com/?q=${a.geo.lat},${a.geo.lng}">View on map</a>` : ""}</div></div>`).join("")}</div>`
          : `<div class="shop-empty"><h2>No addresses <em class="i">yet</em>.</h2></div>`;
        if (editId) {
          const a = editId === "new" ? null : addrs.find((x) => x.id === editId);
          geo = a && a.geo ? a.geo : null;
          const q = geo ? geo.lat + "," + geo.lng : (a ? [a.line, a.area].filter(Boolean).join(", ") : "Cairo, Egypt");
          html += `<form class="box-card" id="adForm" style="margin-top:1rem"><div class="addr-grid">
            <div class="field"><label for="ad_label">Label</label><input class="input" id="ad_label" value="${esc(a ? a.label : "")}" placeholder="Home / Office"></div>
            <div class="field"><label for="ad_area">Area</label><input class="input" id="ad_area" value="${esc(a ? a.area : "")}" placeholder="New Cairo, Cairo"></div>
            <div class="field" style="grid-column:1/-1"><label for="ad_line">Address</label><input class="input" id="ad_line" value="${esc(a ? a.line : "")}" placeholder="Building, street, apartment"></div></div>
            <div class="row" style="margin:.8rem 0"><button type="button" class="btn btn--ghost btn--sm btn--noic" id="ad_geo">Use my location</button><button type="button" class="btn btn--ghost btn--sm btn--noic" id="ad_map">Show on map</button></div>
            <div class="map-frame"><iframe id="adMap" title="Delivery location map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${mapSrc(q)}"></iframe></div>
            <div class="row" style="margin-top:1rem"><button class="btn btn--sm" type="submit">Save address<span class="btn__ic">${I("check")}</span></button><button class="btn btn--ghost btn--sm btn--noic" type="button" id="ad_cancel">Cancel</button></div></form>`;
        } else html += `<button class="btn btn--ghost btn--sm" type="button" id="ad_add" style="margin-top:1rem">Add an address<span class="btn__ic">${I("plus")}</span></button>`;
        b.innerHTML = html;
        if (editId) {
          const setMap = (q) => { const f = $("adMap"); if (f) f.src = mapSrc(q); };
          $("ad_map").addEventListener("click", () => setMap([gv("ad_line"), gv("ad_area")].filter(Boolean).join(", ") || "Cairo, Egypt"));
          $("ad_geo").addEventListener("click", () => {
            if (!navigator.geolocation) { FV.toast("Location isn't available on this device"); return; }
            navigator.geolocation.getCurrentPosition((p) => { geo = { lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6) }; setMap(geo.lat + "," + geo.lng); FV.toast("Location captured"); }, () => FV.toast("Couldn't get your location — allow permission"));
          });
          $("adForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const o = { label: gv("ad_label") || "Address", area: gv("ad_area"), line: gv("ad_line"), geo };
            if (editId === "new") { o.id = Date.now(); o.default = !addrs.length; addrs.push(o); } else Object.assign(addrs.find((x) => x.id === editId), o);
            store.set("fv_addresses", addrs); FV.toast("Address saved"); renderAddr(null);
          });
          $("ad_cancel").addEventListener("click", () => renderAddr(null));
        } else {
          $("ad_add").addEventListener("click", () => renderAddr("new"));
          b.querySelectorAll("[data-aedit]").forEach((el) => el.addEventListener("click", () => renderAddr(+el.dataset.aedit)));
          b.querySelectorAll("[data-arem]").forEach((el) => el.addEventListener("click", () => { addrs = addrs.filter((x) => x.id !== +el.dataset.arem); if (addrs.length && !addrs.some((x) => x.default)) addrs[0].default = true; store.set("fv_addresses", addrs); FV.toast("Address removed"); renderAddr(null); }));
          b.querySelectorAll("[data-adef]").forEach((el) => el.addEventListener("click", () => { addrs.forEach((x) => { x.default = x.id === +el.dataset.adef; }); store.set("fv_addresses", addrs); renderAddr(null); }));
        }
      }
      /* ---- preferences ---- */
      const PREFS = [["updates", "Order updates", "Delivery status by SMS", true], ["letter", "The Fresh Valley Letter", "A monthly note — what's in season", true], ["seasonal", "Seasonal reminders", "A nudge when your favourites are at their peak", false]];
      function renderPrefs() {
        const pr = store.get("fv_prefs", {});
        $("prefs").innerHTML = PREFS.map(([k, t, d, def]) => `<div class="set-row"><div><strong id="pl-${k}">${t}</strong><small>${d}</small></div><button type="button" class="toggle" data-pref="${k}" aria-labelledby="pl-${k}" aria-pressed="${pr[k] == null ? def : !!pr[k]}"></button></div>`).join("");
        $("prefs").querySelectorAll("[data-pref]").forEach((b) => b.addEventListener("click", () => {
          const on = b.getAttribute("aria-pressed") !== "true";
          b.setAttribute("aria-pressed", on);
          const p = store.get("fv_prefs", {}); p[b.dataset.pref] = on; store.set("fv_prefs", p);
          if (b.dataset.pref === "letter") FV.clients.upsert({ name: user.name, email: user.email, marketing: on });
          FV.toast("Preferences saved");
        }));
      }
      renderProfile(false); renderAddr(null); renderPrefs();

      /* ---- tabs ---- */
      const nav = root.querySelector(".acct__nav");
      function show(tab) {
        nav.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === tab));
        root.querySelectorAll(".acct__panel").forEach((p) => p.classList.toggle("active", p.dataset.panel === tab));
        if (tab === "wishlist") renderWish();
        history.replaceState({}, "", "#" + tab);
        $("acctCrumb").textContent = (NAV.find((n) => n[0] === tab) || [0, 0, "My account"])[2];
        FV.observeReveals(root); FV.updateWishUI();
      }
      nav.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => show(b.dataset.tab)));
      $("signOut").addEventListener("click", () => { localStorage.removeItem("fv_user"); location.assign("account.html"); });
      root.addEventListener("click", (e) => {
        const ro = e.target.closest("[data-reorder]");
        if (ro) {
          const o = orders.find((x) => x.id === ro.dataset.reorder); if (!o) return;
          let n = 0;
          (o.items || []).forEach((it) => {
            if (it.type === "box") { const b = FV.findBox(it.slug); if (b) { const t = b.tiers.find((x) => String(it.variant || "").indexOf(x.label) === 0) || b.tiers[0]; FV.cart.add({ key: b.slug + "|" + t.label, slug: b.slug, type: "box", name: b.name, image: b.image, variant: t.label, price: t.price, qty: it.qty || 1 }); n++; } return; }
            const p = FV.find(it.slug); if (!p || FV.soldOut(p)) return;
            const g = p.unit === "kg" ? (FV.weightOptions.find((w) => w.label === it.variant) || { g: 1000 }).g : 0;
            const variant = p.unit === "kg" ? FV.weightLabel(g) : FV.defaultVariant(p).variant;
            FV.cart.add({ key: p.slug + "|" + variant, slug: p.slug, type: "product", name: p.name, image: FV.isCustomImg(p.image) ? p.image : p.slug, noPhoto: !!p.noPhoto, variant, price: p.unit === "kg" ? FV.priceForWeight(p, g) : p.pricePerUnit, qty: it.qty || 1 });
            n++;
          });
          FV.toast(n + " items added", "From " + o.id, true);
          if (window.FVMotion) FVMotion.fly(ro);
          return;
        }
        const rc = e.target.closest("[data-receipt]");
        if (rc) { const o = orders.find((x) => x.id === rc.dataset.receipt); if (o) FV.receipt.open(o); }
      });
      document.addEventListener("fv:wish", () => { if (root.querySelector('[data-panel="wishlist"].active')) { /* guard: re-render lightly */ const n = FV.wish.items().length; $("wishStat").textContent = n; } });
      const initial = (location.hash || "#overview").slice(1);
      show(NAV.some((n) => n[0] === initial) ? initial : "overview");

      /* ============================== AUTH GATE ============================== */
      function gate() {
        $("acctTitle").innerHTML = "Welcome <em class=\"i\">in</em>.";
        $("acctCrumb").textContent = "Sign in";
        $("acctEyebrow").textContent = "Your Fresh Valley";
        root.innerHTML = `<div class="auth">
          <div class="auth__card">
            <div class="auth__tabs" role="group" aria-label="Account"><button type="button" data-auth="signin" aria-pressed="true">Sign in</button><button type="button" data-auth="signup" aria-pressed="false">Create account</button></div>
            <button type="button" class="auth__google" id="gBtn"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8Z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.5 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.4 7.4 24 12 24Z"/><path fill="#FBBC05" d="M5.4 14.4c-.2-.7-.4-1.4-.4-2.4s.1-1.7.4-2.4V6.5H1.4C.5 8.2 0 10 0 12s.5 3.8 1.4 5.5l4-3.1Z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.5 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.6 1.4 6.5l4 3.1C6.3 6.8 8.9 4.8 12 4.8Z"/></svg><span id="gLabel">Continue with Google</span></button>
            <div class="auth__or">or</div>
            <form class="auth__form" id="authForm" novalidate>
              <div class="field su" hidden><label for="au_name">Full name</label><input class="input" id="au_name" name="name" autocomplete="name" placeholder="Your name"></div>
              <div class="field"><label for="au_email">Email</label><input class="input" id="au_email" type="email" name="email" autocomplete="email" placeholder="you@email.com" required></div>
              <div class="field su" hidden><label for="au_phone">Phone</label><input class="input" id="au_phone" type="tel" name="phone" autocomplete="tel" placeholder="+20 1XX XXX XXXX"></div>
              <div class="field"><label for="au_pass">Password</label><input class="input" id="au_pass" type="password" name="password" autocomplete="current-password" placeholder="••••••••" required minlength="4"></div>
              <button class="btn btn--lg btn--block" type="submit" id="authSubmit"><span id="authLabel">Sign in</span><span class="btn__ic">${I("arrow")}</span></button>
            </form>
            <p class="muted-note">Demo — sign in with any email &amp; password, or continue with Google. Your details stay in this browser only.</p>
          </div>
          <aside class="auth__aside">${S.img("banner:packaging", { sizes: "(max-width: 960px) 100vw, 50vw", alt: "" })}<div><h2>Welcome to <em class="i">Fresh Valley</em></h2><p>Track orders, save favourites, reorder in a tap, and manage your hosting boxes.</p></div></aside>
        </div>`;
        const form = $("authForm");
        let mode = "signin";
        const nameFrom = (email) => email.split("@")[0].replace(/[._-]+/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
        function signIn(email, name, isNew, phone) {
          store.set("fv_user", { name, email, phone: phone || "" });
          FV.clients.upsert({ name, email, phone: phone || "", status: isNew ? "new" : "active" });
          FV.toast("Welcome, " + name.split(" ")[0]);
          setTimeout(() => location.reload(), 400);
        }
        function setMode(m) {
          mode = m;
          root.querySelectorAll("[data-auth]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.auth === m));
          root.querySelectorAll(".su").forEach((f) => { f.hidden = m !== "signup"; });
          form.name.required = m === "signup";
          $("authLabel").textContent = m === "signup" ? "Create account" : "Sign in";
          $("gLabel").textContent = m === "signup" ? "Sign up with Google" : "Continue with Google";
          $("au_pass").setAttribute("autocomplete", m === "signup" ? "new-password" : "current-password");
        }
        root.querySelectorAll("[data-auth]").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.auth)));
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          if (!form.checkValidity()) { form.reportValidity(); return; }
          const email = form.email.value.trim(), isNew = mode === "signup";
          signIn(email, isNew && form.name.value.trim() ? form.name.value.trim() : nameFrom(email), isNew, isNew ? form.phone.value.trim() : "");
        });
        $("gBtn").addEventListener("click", () => {
          const typed = form.email.value.trim(), email = typed.includes("@") ? typed : "guest@gmail.com";
          signIn(email, mode === "signup" && form.name.value.trim() ? form.name.value.trim() : nameFrom(email), mode === "signup", "");
        });
        if (location.hash === "#signup") setMode("signup");
      }
    })();
  </script>
  <script defer src="assets/vendor/gsap.min.js"></script>
  <script defer src="assets/vendor/ScrollTrigger.min.js"></script>
  <script defer src="assets/vendor/SplitText.min.js"></script>
  <script defer src="assets/vendor/lenis.min.js"></script>
  <script defer src="assets/js/motion.js"></script>
</body>
