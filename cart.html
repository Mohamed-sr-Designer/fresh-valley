<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Your Basket — Fresh Valley</title>
  <meta name="description" content="Review your Fresh Valley basket — export-grade produce and curated boxes, delivered next-day across Cairo.">
  <meta name="theme-color" content="#19291C">
  <meta name="robots" content="noindex">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/fraunces-v4s.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/jakarta-s.woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/shop.css">
  <script>!function(d,w){var h=d.documentElement,L=0;if(/[?&](fv_preview|bake)=1/.test(location.search)||w.matchMedia("(prefers-reduced-motion: reduce)").matches)return;h.classList.add("m-on");try{if(!sessionStorage.getItem("fv_seen")){sessionStorage.setItem("fv_seen","1");h.classList.add("is-loading");L=1}}catch(e){}setTimeout(function(){if(!(w.FVMotion&&w.FVMotion.ready))h.classList.remove("m-on");h.classList.remove("is-loading","is-lifting")},L?5200:3500)}(document,window)</script>
</head>
<body data-page="cart">
  <!--loader--><div class="loader" aria-hidden="true"><div class="loader__in"><span class="loader__logo"></span><span class="loader__line"></span><span class="loader__note" id="fvLoadNote">Picked at first light</span></div></div><script>!function(){var d=new Date,m=d.getMonth(),s=new Date(d.getFullYear(),0,1),w=Math.ceil(((d-s)/864e5+s.getDay()+1)/7),n=[11,0,1].indexOf(m)>-1?"winter":m<5?"spring":m<8?"summer":"autumn",o={winter:11,spring:2,summer:5,autumn:8}[n],e=document.getElementById("fvLoadNote");e&&(e.textContent="Week "+w+" \u00b7 "+["Early","Mid","Late"][(m-o+12)%12]+" "+n+" in the valley")}()</script><!--/loader-->
  <div id="fv-header"></div>
  <noscript><p class="noscript">Fresh Valley uses JavaScript for its menu, basket and checkout. <a href="products.html">Browse the collection</a> · <a href="contact.html">Contact us</a></p></noscript>

  <main id="main">
    <section class="s shop-head">
      <div class="wrap wrap--wide">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span aria-current="page">Basket</span></nav>
        <div class="page-head">
          <div><p class="eyebrow">Almost on its way</p><h1>Your <em class="i">basket</em><span class="shop-head__count" id="headCount"></span></h1></div>
          <div class="page-head__side"><div id="headMeter" style="width:100%"></div></div>
        </div>
      </div>
    </section>

    <section class="s sec--flush-top">
      <div class="wrap wrap--wide"><div id="cartWrap" aria-live="polite"></div></div>
    </section>

    <section class="s sec band--mist" id="suggestSec">
      <div class="wrap wrap--wide">
        <div class="head"><div class="head__main"><p class="eyebrow">Complete your table</p><h2 data-split>You might also <em class="i">like</em></h2></div>
          <div class="head__actions"><a class="link-u" href="products.html" id="shopAll">Shop all</a></div></div>
        <div class="rail-wrap"><div class="rail" id="suggest"></div><div class="rail-progress" aria-hidden="true"><i></i></div></div>
      </div>
    </section>
  </main>

  <div id="fv-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/content.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/sections.js"></script>
  <script>
    (function () {
      const S = window.FVSections, esc = FV.esc, I = FV.icon;
      const wrap = document.getElementById("cartWrap");
      const SET = FV.settings;
      document.getElementById("shopAll").insertAdjacentHTML("beforeend", " " + I("arrow"));
      const getCode = () => { try { return sessionStorage.getItem("fv_code") || ""; } catch (_) { return ""; } };
      const setCode = (c) => { try { c ? sessionStorage.setItem("fv_code", c) : sessionStorage.removeItem("fv_code"); } catch (_) {} };
      let codeMsg = "";

      function lineMedia(it) {
        if (it.noPhoto) return `<div class="cart-line__img">${I("leaf2")}</div>`;
        return `<div class="cart-line__img"><img src="${esc(FV.imgSrc(it.image))}" alt="" loading="lazy" width="112" height="112"></div>`;
      }
      function totals() {
        const sub = FV.cart.subtotal();
        const delivery = sub >= SET.freeThreshold ? 0 : SET.deliveryFee;
        const d = FV.discounts.find(getCode());
        const off = d ? FV.discounts.value(d, sub, delivery) : 0;
        return { sub, delivery, d, off, total: Math.max(0, sub + delivery - off), minMiss: d && d.min && sub < +d.min ? +d.min - sub : 0 };
      }
      function render() {
        const items = FV.cart.items();
        document.getElementById("headCount").textContent = items.length ? FV.cart.count() : "";
        if (!items.length) {
          document.getElementById("headMeter").innerHTML = "";
          wrap.innerHTML = `<div class="shop-empty"><h2>Your basket is <em class="i">empty</em>.</h2>
            <p class="muted">The season is waiting — start with a best seller or a curated box.</p>
            <div class="row" style="justify-content:center;margin-top:1.4rem"><a class="btn" href="products.html">Browse the market<span class="btn__ic">${I("arrow")}</span></a><a class="btn btn--ghost" href="products.html?cat=boxes">Hosting boxes<span class="btn__ic">${I("gift")}</span></a></div></div>`;
          return;
        }
        const t = totals();
        document.getElementById("headMeter").innerHTML = FV.shipMeter(t.sub);
        wrap.innerHTML = `
        <div class="cart">
          <div class="cart__lines">
            ${items.map((it) => `
              <article class="cart-line">
                ${lineMedia(it)}
                <div>
                  <h2 class="cart-line__name"><a href="${it.type === "box" ? "product.html?box=" : "product.html?slug="}${esc(it.slug)}">${esc(it.name)}</a></h2>
                  <p class="cart-line__var">${it.type === "box" ? "Box · " : ""}${esc(it.variant)}${it.note && it.note.indexOf("Card:") > -1 ? `<br><em>“${esc(it.note.split("Card: ")[1])}”</em>` : ""}</p>
                  <div class="cart-line__ctl">
                    <div class="qty"><button type="button" data-dec="${esc(it.key)}" aria-label="Decrease ${esc(it.name)}">${I("minus")}</button><input value="${it.qty}" readonly aria-label="Quantity of ${esc(it.name)}"><button type="button" data-inc="${esc(it.key)}" aria-label="Increase ${esc(it.name)}">${I("plus")}</button></div>
                    <button type="button" class="cart-line__rm" data-rm="${esc(it.key)}">${I("trash")} Remove</button>
                  </div>
                </div>
                <div class="cart-line__price"><b>${FV.money(it.price * it.qty)}</b>${it.qty > 1 ? `<small>${FV.money(it.price)} each</small>` : ""}</div>
              </article>`).join("")}
            <a class="link-u cart-continue" href="products.html">${I("arrowL")} Continue shopping</a>
          </div>
          <aside class="summary" aria-labelledby="sumHead">
            <h2 id="sumHead">Order summary</h2>
            ${t.d ? `<div class="code-applied"><span>${I("check")} ${esc(t.d.code)} applied${t.minMiss ? ` — add ${FV.money(t.minMiss)} to unlock` : ""}</span><button type="button" id="codeRm" aria-label="Remove code">${I("close")}</button></div>`
              : `<form class="code" id="codeForm"><label class="sr-only" for="codeIn">Discount code</label><input class="input" id="codeIn" placeholder="Discount code" autocomplete="off"><button class="btn btn--ghost btn--sm btn--noic" type="submit">Apply</button></form><p class="code-msg" id="codeMsg" role="status">${esc(codeMsg)}</p>`}
            <div class="sum-row"><span>Subtotal</span><strong>${FV.money(t.sub)}</strong></div>
            ${t.off ? `<div class="sum-row sum-row--saving"><span>Discount</span><strong>− ${FV.money(t.off)}</strong></div>` : ""}
            <div class="sum-row"><span>Delivery</span><span>${t.delivery ? FV.money(t.delivery) : "Free"}</span></div>
            <div class="sum-row sum-row--total"><span>Total</span><span>${FV.money(t.total)}</span></div>
            <a class="btn btn--lg btn--block" href="checkout.html">Checkout<span class="btn__ic">${I("arrow")}</span></a>
            <ul class="trust">
              <li>${I("snow")}<span>Cold-chain from harvest to door</span></li>
              <li>${I("shield")}<span>Not perfect? We replace it.</span></li>
              <li>${I("truck")}<span>Next-day slots — order before ${SET.cutoffHour > 12 ? SET.cutoffHour - 12 + "pm" : SET.cutoffHour + "am"}</span></li>
            </ul>
            <div class="pay-row" aria-label="Accepted payment methods">${FV.payMarks}${SET.codEnabled ? FV.payMark("cod") : ""}</div>
          </aside>
        </div>`;
        const f = document.getElementById("codeForm");
        if (f) f.addEventListener("submit", (e) => {
          e.preventDefault();
          const v = document.getElementById("codeIn").value.trim().toUpperCase();
          if (!v) return;
          if (FV.discounts.find(v)) { setCode(v); codeMsg = ""; FV.toast("Code applied", v); }
          else { codeMsg = "That code isn't valid or has expired."; }
          render();
        });
        const rm = document.getElementById("codeRm");
        if (rm) rm.addEventListener("click", () => { setCode(""); render(); });
      }
      function renderSuggest() {
        const inCart = new Set(FV.cart.items().map((i) => i.slug));
        const picks = FV.byCollection("best-sellers").concat(FV.byCollection("hosting")).filter((p, i, a) => a.indexOf(p) === i && !inCart.has(p.slug)).slice(0, 10);
        document.getElementById("suggest").innerHTML = picks.map(FV.productCardHTML).join("");
        document.getElementById("suggestSec").hidden = !picks.length;
        FV.updateWishUI();
      }
      render(); renderSuggest();
      document.addEventListener("fv:cart", () => { render(); renderSuggest(); FV.observeReveals(document.getElementById("suggest")); });
    })();
  </script>
  <script defer src="assets/vendor/gsap.min.js"></script>
  <script defer src="assets/vendor/ScrollTrigger.min.js"></script>
  <script defer src="assets/vendor/SplitText.min.js"></script>
  <script defer src="assets/vendor/lenis.min.js"></script>
  <script defer src="assets/js/motion.js"></script>
</body>
</html>
